<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>CT Overlay - Catarina Tracker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 1080px;
      height: 1920px;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Poppins', Arial, sans-serif;
      background: linear-gradient(180deg, #4F3EC7, #362A7A);
      color: #fff;
    }

    body {
      position: relative;
    }

    .wrap {
      width: 100%;
      height: 100%;
      padding: 28px 28px 36px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    #title {
      font-size: 42px;
      font-weight: 800;
      color: #FFD54A;
      text-align: center;
      line-height: 1.1;
      text-shadow: 0 2px 10px rgba(0,0,0,0.25);
      margin-top: 8px;
    }

    #huntCard {
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 26px;
      padding: 24px 26px;
      backdrop-filter: blur(8px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.18);
    }

    #huntName {
      font-size: 34px;
      font-weight: 800;
      margin-bottom: 10px;
      text-align: center;
      word-break: break-word;
    }

    .metaRow {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .pill {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 22px;
      font-weight: 700;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .statBox {
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 24px;
      padding: 20px 16px;
      text-align: center;
      box-shadow: 0 10px 24px rgba(0,0,0,0.14);
    }

    .statLabel {
      font-size: 21px;
      opacity: 0.9;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .statValue {
      font-size: 42px;
      font-weight: 800;
      line-height: 1;
    }

    .moneyStats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .moneyBox {
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 24px;
      padding: 20px 16px;
      text-align: center;
      box-shadow: 0 10px 24px rgba(0,0,0,0.14);
      min-height: 122px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .moneyLabel {
      font-size: 20px;
      opacity: 0.9;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .moneyValue {
      font-size: 34px;
      font-weight: 900;
      line-height: 1.05;
      word-break: break-word;
    }

    .moneyValue.positive {
      color: #A5D6A7;
      text-shadow: 0 0 18px rgba(165,214,167,0.16);
    }

    .moneyValue.negative {
      color: #FFAB91;
      text-shadow: 0 0 18px rgba(255,171,145,0.16);
    }

    .moneyValue.neutral {
      color: #fff;
    }

    #bonusPanel {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0,0,0,0.18);
    }

    #bonusHeader {
      padding: 20px 24px 16px;
      font-size: 30px;
      font-weight: 800;
      color: #FFD54A;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.08);
    }

    #bonusViewport {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      padding: 18px;
    }

    #bonusTrack {
      position: absolute;
      top: 18px;
      left: 18px;
      right: 18px;
      will-change: transform;
    }

    .bonusList {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .bonusItem {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 20px;
      border-radius: 22px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.12);
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0,0,0,0.10);
    }

    .bonusItem.highlight {
      background:
        linear-gradient(90deg, rgba(255,213,74,0.18), rgba(255,255,255,0.12)),
        rgba(255,255,255,0.10);
      border-color: rgba(255,213,74,0.95);
      box-shadow:
        0 0 0 2px rgba(255,213,74,0.12),
        0 14px 36px rgba(0,0,0,0.22),
        0 0 34px rgba(255,213,74,0.20);
      transform: scale(1.01);
    }

    .bonusItem.highlight::before {
      content: "";
      position: absolute;
      left: 0;
      top: 10px;
      bottom: 10px;
      width: 8px;
      border-radius: 999px;
      background: linear-gradient(180deg, #FFD54A, #FFB300);
      box-shadow: 0 0 18px rgba(255,213,74,0.45);
    }

    .bonusItem.highlight::after {
      content: "";
      position: absolute;
      top: 0;
      left: -35%;
      width: 35%;
      height: 100%;
      background: linear-gradient(
        90deg,
        rgba(255,255,255,0),
        rgba(255,255,255,0.16),
        rgba(255,255,255,0)
      );
      transform: skewX(-18deg);
      animation: highlightShine 3s linear infinite;
      pointer-events: none;
    }

    .bonusLeft {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
      flex: 1;
      padding-left: 6px;
    }

    .bonusTopRow {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex-wrap: wrap;
    }

    .bonusName {
      font-size: 26px;
      font-weight: 800;
      line-height: 1.15;
      word-break: break-word;
    }

    .highlightBadge {
      display: none;
      align-items: center;
      justify-content: center;
      padding: 6px 12px;
      border-radius: 999px;
      background: linear-gradient(180deg, #FFE082, #FFD54A);
      color: #372A79;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.8px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.18);
      white-space: nowrap;
    }

    .bonusItem.highlight .highlightBadge {
      display: inline-flex;
    }

    .bonusSub {
      font-size: 18px;
      opacity: 0.82;
      font-weight: 600;
      word-break: break-word;
    }

    .bonusStatus {
      min-width: 170px;
      text-align: center;
      border-radius: 999px;
      padding: 12px 18px;
      font-size: 20px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.10);
      flex-shrink: 0;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
    }

    .status-pendente {
      background: rgba(255, 193, 7, 0.18);
      color: #FFE082;
    }

    .status-feito {
      background: rgba(76, 175, 80, 0.18);
      color: #A5D6A7;
    }

    .status-ativo {
      background: rgba(33, 150, 243, 0.18);
      color: #90CAF9;
    }

    .status-cancelado {
      background: rgba(244, 67, 54, 0.18);
      color: #FFAB91;
    }

    .emptyState {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
      font-size: 30px;
      font-weight: 700;
      opacity: 0.92;
    }

    .footerNote {
      text-align: center;
      font-size: 18px;
      opacity: 0.65;
      font-weight: 600;
      margin-top: 2px;
    }

    #debugBox {
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: 20px;
      z-index: 20;
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 16px;
      padding: 12px 14px;
      font-size: 16px;
      line-height: 1.4;
      color: #fff;
      display: none;
      white-space: pre-wrap;
      word-break: break-word;
    }

    #debugBox.show {
      display: block;
    }

    @keyframes highlightShine {
      0% {
        left: -40%;
      }
      100% {
        left: 120%;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="title">Catarina Tracker</div>

    <div id="huntCard">
      <div id="huntName">A carregar hunt ativa...</div>
      <div class="metaRow">
        <div class="pill" id="huntId">ID: —</div>
        <div class="pill" id="huntStatus">Estado: —</div>
      </div>
    </div>

    <div class="stats">
      <div class="statBox">
        <div class="statLabel">Total</div>
        <div class="statValue" id="statTotal">0</div>
      </div>
      <div class="statBox">
        <div class="statLabel">Feitos</div>
        <div class="statValue" id="statDone">0</div>
      </div>
      <div class="statBox">
        <div class="statLabel">Pendentes</div>
        <div class="statValue" id="statPending">0</div>
      </div>
    </div>

    <div class="moneyStats">
      <div class="moneyBox">
        <div class="moneyLabel">Total Pago</div>
        <div class="moneyValue neutral" id="moneyTotalPago">€0,00</div>
      </div>
      <div class="moneyBox">
        <div class="moneyLabel">Average X</div>
        <div class="moneyValue neutral" id="moneyAverageX">0,00x</div>
      </div>
      <div class="moneyBox">
        <div class="moneyLabel">Profit / Loss</div>
        <div class="moneyValue neutral" id="moneyProfitLoss">€0,00</div>
      </div>
    </div>

    <div id="bonusPanel">
      <div id="bonusHeader">Bónus</div>
      <div id="bonusViewport">
        <div id="bonusTrack"></div>
      </div>
    </div>

    <div class="footerNote">Overlay ativo</div>
  </div>

  <div id="debugBox"></div>

  <script src="../admin/conexao.js"></script>

  <script>
    (() => {
      const CT_TABLE_HUNTS = "hunts";
      const CT_TABLE_BONUS = "bonus";
      const CT_SCROLL_SPEED = 28;

      const CT_ELS = {
        huntName: document.getElementById("huntName"),
        huntId: document.getElementById("huntId"),
        huntStatus: document.getElementById("huntStatus"),
        statTotal: document.getElementById("statTotal"),
        statDone: document.getElementById("statDone"),
        statPending: document.getElementById("statPending"),
        moneyTotalPago: document.getElementById("moneyTotalPago"),
        moneyAverageX: document.getElementById("moneyAverageX"),
        moneyProfitLoss: document.getElementById("moneyProfitLoss"),
        bonusTrack: document.getElementById("bonusTrack"),
        bonusViewport: document.getElementById("bonusViewport"),
        debugBox: document.getElementById("debugBox")
      };

      let ctLastSignature = "";
      let ctScrollRaf = null;
      let ctScrollOffset = 0;
      let ctFirstListHeight = 0;
      let ctIsScrolling = false;
      let ctLastTs = 0;

      function ctShowDebug(message) {
        console.error("[CT OVERLAY]", message);
        CT_ELS.debugBox.textContent = String(message);
        CT_ELS.debugBox.classList.add("show");
      }

      function ctHideDebug() {
        CT_ELS.debugBox.textContent = "";
        CT_ELS.debugBox.classList.remove("show");
      }

      function ctEscapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function ctNormalizeStatus(value) {
        const raw = String(value || "").trim().toLowerCase();

        if (
          raw === "done" ||
          raw === "completed" ||
          raw === "complete" ||
          raw === "feito" ||
          raw === "fechado" ||
          raw === "closed"
        ) return "feito";

        if (
          raw === "active" ||
          raw === "ativo" ||
          raw === "ativa" ||
          raw === "activa" ||
          raw === "running"
        ) return "ativo";

        if (
          raw === "cancelled" ||
          raw === "canceled" ||
          raw === "cancelado"
        ) return "cancelado";

        return "pendente";
      }

      function ctFormatStatusLabel(status) {
        switch (status) {
          case "feito": return "Feito";
          case "ativo": return "Ativo";
          case "cancelado": return "Cancelado";
          default: return "Pendente";
        }
      }

      function ctGetBonusName(bonus) {
        return (
          bonus.slot_name ||
          bonus.nome_slot ||
          bonus.name ||
          bonus.nome ||
          bonus.slot ||
          bonus.title ||
          bonus.slot_id ||
          `Bónus #${bonus.id ?? ""}`
        );
      }

      function ctGetBonusSub(bonus) {
        const parts = [];

        if (bonus.slot_id) parts.push(`ID: ${bonus.slot_id}`);
        if (bonus.aposta != null && bonus.aposta !== "") parts.push(`Aposta: ${ctFormatPlainNumber(bonus.aposta)}`);
        if (bonus.payout != null && bonus.payout !== "") parts.push(`Payout: ${ctFormatPlainNumber(bonus.payout)}`);

        return parts.join(" • ");
      }

      function ctFormatPlainNumber(value, decimals = 2) {
        const num = Number(value || 0);
        return num.toLocaleString("pt-PT", {
          minimumFractionDigits: decimals,
          maximumFractionDigits: decimals
        });
      }

      function ctFormatMoney(value) {
        const num = Number(value || 0);
        const abs = Math.abs(num);

        return `€${abs.toLocaleString("pt-PT", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        })}`;
      }

      function ctFormatMoneySigned(value) {
        const num = Number(value || 0);

        if (num > 0) return `+${ctFormatMoney(num)}`;
        if (num < 0) return `-${ctFormatMoney(num)}`;
        return ctFormatMoney(0);
      }

      function ctFormatAverageX(value) {
        const num = Number(value || 0);
        return `${num.toLocaleString("pt-PT", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        })}x`;
      }

      function ctSetMoneyValue(el, value, formatter) {
        const num = Number(value || 0);

        el.classList.remove("positive", "negative", "neutral");

        if (num > 0) {
          el.classList.add("positive");
        } else if (num < 0) {
          el.classList.add("negative");
        } else {
          el.classList.add("neutral");
        }

        el.textContent = formatter(num);
      }

      function ctSetNeutralValue(el, value, formatter) {
        el.classList.remove("positive", "negative", "neutral");
        el.classList.add("neutral");
        el.textContent = formatter(Number(value || 0));
      }

      function ctStopAutoScroll() {
        if (ctScrollRaf) {
          cancelAnimationFrame(ctScrollRaf);
          ctScrollRaf = null;
        }

        ctScrollOffset = 0;
        ctFirstListHeight = 0;
        ctIsScrolling = false;
        ctLastTs = 0;
        CT_ELS.bonusTrack.style.transform = "translateY(0px)";
      }

      function ctAutoScrollStep(ts) {
        if (!ctIsScrolling) return;

        if (!ctLastTs) ctLastTs = ts;
        const dt = (ts - ctLastTs) / 1000;
        ctLastTs = ts;

        ctScrollOffset += CT_SCROLL_SPEED * dt;

        if (ctScrollOffset >= ctFirstListHeight) {
          ctScrollOffset = 0;
        }

        CT_ELS.bonusTrack.style.transform = `translateY(-${ctScrollOffset}px)`;
        ctScrollRaf = requestAnimationFrame(ctAutoScrollStep);
      }

      function ctStartAutoScroll(firstListHeight) {
        ctStopAutoScroll();
        ctFirstListHeight = firstListHeight;
        ctIsScrolling = true;
        ctScrollRaf = requestAnimationFrame(ctAutoScrollStep);
      }

      function ctRenderEmpty(message) {
        ctStopAutoScroll();
        CT_ELS.huntName.textContent = message;
        CT_ELS.huntId.textContent = "ID: —";
        CT_ELS.huntStatus.textContent = "Estado: —";
        CT_ELS.statTotal.textContent = "0";
        CT_ELS.statDone.textContent = "0";
        CT_ELS.statPending.textContent = "0";
        ctSetNeutralValue(CT_ELS.moneyTotalPago, 0, ctFormatMoney);
        ctSetNeutralValue(CT_ELS.moneyAverageX, 0, ctFormatAverageX);
        ctSetMoneyValue(CT_ELS.moneyProfitLoss, 0, ctFormatMoneySigned);
        CT_ELS.bonusTrack.innerHTML = `<div class="emptyState">${ctEscapeHtml(message)}</div>`;
      }

      function ctGetHighlightedIndex(bonuses) {
        if (!bonuses.length) return -1;

        const activeIndex = bonuses.findIndex(b => ctNormalizeStatus(b.status) === "ativo");
        if (activeIndex !== -1) return activeIndex;

        const pendingIndex = bonuses.findIndex(b => {
          const status = ctNormalizeStatus(b.status);
          return status !== "feito" && status !== "cancelado";
        });
        if (pendingIndex !== -1) return pendingIndex;

        return bonuses.length - 1;
      }

      function ctRenderBonusListHtml(bonuses, highlightedIndex) {
        return `
          <div class="bonusList">
            ${bonuses.map((bonus, index) => {
              const status = ctNormalizeStatus(bonus.status);
              const bonusName = ctGetBonusName(bonus);
              const bonusSub = ctGetBonusSub(bonus);
              const isHighlight = index === highlightedIndex;

              return `
                <div class="bonusItem${isHighlight ? " highlight" : ""}">
                  <div class="bonusLeft">
                    <div class="bonusTopRow">
                      <div class="bonusName">${ctEscapeHtml(bonusName)}</div>
                      <div class="highlightBadge">EM DESTAQUE</div>
                    </div>
                    <div class="bonusSub">${bonusSub ? ctEscapeHtml(bonusSub) : "&nbsp;"}</div>
                  </div>
                  <div class="bonusStatus status-${status}">
                    ${ctFormatStatusLabel(status)}
                  </div>
                </div>
              `;
            }).join("")}
          </div>
        `;
      }

      function ctResolveConfig() {
        if (window.CT_SUPABASE?.url && window.CT_SUPABASE?.key) {
          return window.CT_SUPABASE;
        }

        return null;
      }

      async function ctFetchJson(url, headers) {
        const res = await fetch(url, { headers });

        if (!res.ok) {
          const text = await res.text().catch(() => "");
          throw new Error(`Erro ${res.status}: ${text || "fetch falhou"}`);
        }

        return res.json();
      }

      async function ctGetActiveHunt(baseUrl, headers) {
        const url = `${baseUrl}/rest/v1/${CT_TABLE_HUNTS}?select=*&status=eq.ativa&order=id.desc&limit=1`;
        const data = await ctFetchJson(url, headers);
        return data?.[0] || null;
      }

      async function ctGetBonusesByHunt(baseUrl, headers, huntId) {
        const url = `${baseUrl}/rest/v1/${CT_TABLE_BONUS}?select=*&hunt_id=eq.${encodeURIComponent(huntId)}&order=id.asc`;
        return await ctFetchJson(url, headers);
      }

      function ctBuildSignature(hunt, bonuses) {
        return JSON.stringify({
          huntId: hunt?.id ?? null,
          huntName: hunt?.name ?? "",
          huntStatus: hunt?.status ?? "",
          total_pago: hunt?.total_pago ?? 0,
          average_x: hunt?.average_x ?? 0,
          profit_loss: hunt?.profit_loss ?? 0,
          bonuses: bonuses.map(b => ({
            id: b.id ?? null,
            name: ctGetBonusName(b),
            status: ctNormalizeStatus(b.status),
            slot_id: b.slot_id ?? null,
            payout: b.payout ?? null,
            aposta: b.aposta ?? null
          }))
        });
      }

      function ctRenderOverlay(hunt, bonuses) {
        const total = bonuses.length;
        const done = bonuses.filter(b => ctNormalizeStatus(b.status) === "feito").length;
        const pending = bonuses.filter(b => {
          const status = ctNormalizeStatus(b.status);
          return status !== "feito" && status !== "cancelado";
        }).length;

        CT_ELS.huntName.textContent = hunt.name || `Hunt #${hunt.id}`;
        CT_ELS.huntId.textContent = `ID: ${hunt.id ?? "—"}`;
        CT_ELS.huntStatus.textContent = `Estado: ${hunt.status || "—"}`;
        CT_ELS.statTotal.textContent = String(total);
        CT_ELS.statDone.textContent = String(done);
        CT_ELS.statPending.textContent = String(pending);

        ctSetNeutralValue(CT_ELS.moneyTotalPago, hunt.total_pago ?? 0, ctFormatMoney);
        ctSetNeutralValue(CT_ELS.moneyAverageX, hunt.average_x ?? 0, ctFormatAverageX);
        ctSetMoneyValue(CT_ELS.moneyProfitLoss, hunt.profit_loss ?? 0, ctFormatMoneySigned);

        if (!bonuses.length) {
          ctStopAutoScroll();
          CT_ELS.bonusTrack.innerHTML = `<div class="emptyState">Sem bónus nesta hunt.</div>`;
          return;
        }

        const highlightedIndex = ctGetHighlightedIndex(bonuses);
        const listHtml = ctRenderBonusListHtml(bonuses, highlightedIndex);

        ctStopAutoScroll();
        CT_ELS.bonusTrack.innerHTML = listHtml;

        requestAnimationFrame(() => {
          const firstList = CT_ELS.bonusTrack.querySelector(".bonusList");
          if (!firstList) return;

          const firstListHeight = firstList.offsetHeight;
          const viewportHeight = CT_ELS.bonusViewport.clientHeight;

          if (firstListHeight > viewportHeight) {
            CT_ELS.bonusTrack.innerHTML = listHtml + listHtml;

            requestAnimationFrame(() => {
              const realFirstList = CT_ELS.bonusTrack.querySelector(".bonusList");
              if (!realFirstList) return;

              ctStartAutoScroll(realFirstList.offsetHeight);
            });
          } else {
            CT_ELS.bonusTrack.style.transform = "translateY(0px)";
          }
        });
      }

      async function ctRefreshOverlay() {
        try {
          const config = ctResolveConfig();

          if (!config) {
            ctShowDebug("Configuração Supabase não encontrada no window.CT_SUPABASE");
            ctRenderEmpty("Configuração Supabase em falta.");
            return;
          }

          ctHideDebug();

          const ctHeaders = {
            apikey: config.key,
            Authorization: `Bearer ${config.key}`,
            "Content-Type": "application/json"
          };

          const hunt = await ctGetActiveHunt(config.url, ctHeaders);

          if (!hunt) {
            ctRenderEmpty("Sem hunt ativa.");
            return;
          }

          const bonuses = await ctGetBonusesByHunt(config.url, ctHeaders, hunt.id);
          const signature = ctBuildSignature(hunt, bonuses);

          if (signature === ctLastSignature) return;
          ctLastSignature = signature;

          ctRenderOverlay(hunt, bonuses);
        } catch (error) {
          ctShowDebug(error?.message || error);
          ctRenderEmpty("Erro ao carregar overlay.");
        }
      }

      ctRefreshOverlay();
      setInterval(ctRefreshOverlay, 4000);
    })();
  </script>
</body>
</html>
