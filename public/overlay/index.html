<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>CT Overlay - Catarina Tracker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 1080px;
      height: 1920px;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Poppins', Arial, sans-serif;
      background: linear-gradient(180deg, #4F3EC7, #362A7A);
      color: #fff;
    }

    body {
      position: relative;
    }

    .wrap {
      width: 100%;
      height: 100%;
      padding: 28px 28px 36px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    #title {
      font-size: 42px;
      font-weight: 800;
      color: #FFD54A;
      text-align: center;
      line-height: 1.1;
      text-shadow: 0 2px 10px rgba(0,0,0,0.25);
      margin-top: 8px;
    }

    #huntCard {
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 26px;
      padding: 24px 26px;
      backdrop-filter: blur(8px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.18);
    }

    #huntName {
      font-size: 34px;
      font-weight: 800;
      margin-bottom: 10px;
      text-align: center;
      word-break: break-word;
    }

    .metaRow {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .pill {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 22px;
      font-weight: 700;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .statBox {
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 24px;
      padding: 20px 16px;
      text-align: center;
      box-shadow: 0 10px 24px rgba(0,0,0,0.14);
    }

    .statLabel {
      font-size: 21px;
      opacity: 0.9;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .statValue {
      font-size: 42px;
      font-weight: 800;
      line-height: 1;
    }

    #bonusPanel {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0,0,0,0.18);
    }

    #bonusHeader {
      padding: 20px 24px 16px;
      font-size: 30px;
      font-weight: 800;
      color: #FFD54A;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.08);
    }

    #bonusViewport {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      padding: 18px;
    }

    #bonusTrack {
      position: absolute;
      top: 18px;
      left: 18px;
      right: 18px;
      will-change: transform;
    }

    .bonusList {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .bonusItem {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 20px;
      border-radius: 22px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.12);
    }

    .bonusLeft {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
      flex: 1;
    }

    .bonusName {
      font-size: 26px;
      font-weight: 800;
      line-height: 1.15;
      word-break: break-word;
    }

    .bonusSub {
      font-size: 18px;
      opacity: 0.82;
      font-weight: 600;
      word-break: break-word;
    }

    .bonusStatus {
      min-width: 170px;
      text-align: center;
      border-radius: 999px;
      padding: 12px 18px;
      font-size: 20px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.10);
    }

    .status-pendente {
      background: rgba(255, 193, 7, 0.18);
      color: #FFE082;
    }

    .status-feito {
      background: rgba(76, 175, 80, 0.18);
      color: #A5D6A7;
    }

    .status-ativo {
      background: rgba(33, 150, 243, 0.18);
      color: #90CAF9;
    }

    .status-cancelado {
      background: rgba(244, 67, 54, 0.18);
      color: #FFAB91;
    }

    .emptyState {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
      font-size: 30px;
      font-weight: 700;
      opacity: 0.92;
    }

    .footerNote {
      text-align: center;
      font-size: 18px;
      opacity: 0.65;
      font-weight: 600;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="title">Catarina Tracker</div>

    <div id="huntCard">
      <div id="huntName">A carregar hunt ativa...</div>
      <div class="metaRow">
        <div class="pill" id="huntId">ID: —</div>
        <div class="pill" id="huntStatus">Estado: —</div>
      </div>
    </div>

    <div class="stats">
      <div class="statBox">
        <div class="statLabel">Total</div>
        <div class="statValue" id="statTotal">0</div>
      </div>
      <div class="statBox">
        <div class="statLabel">Feitos</div>
        <div class="statValue" id="statDone">0</div>
      </div>
      <div class="statBox">
        <div class="statLabel">Pendentes</div>
        <div class="statValue" id="statPending">0</div>
      </div>
    </div>

    <div id="bonusPanel">
      <div id="bonusHeader">Bónus</div>
      <div id="bonusViewport">
        <div id="bonusTrack"></div>
      </div>
    </div>

    <div class="footerNote">Overlay ativo</div>
  </div>

  <!-- Mantém o teu ficheiro atual de ligação ao Supabase -->
  <script src="../admin/conexao.js"></script>

  <script>
    /*
      IMPORTANTE:
      - Este ficheiro assume que o teu conexao.js já expõe SUPABASE_URL
      - e SUPABASE_ANON_KEY ou SUPABASE_KEY
      - Se no teu conexao.js os nomes forem diferentes, ajusta só estas 2 linhas
    */
    const SUPABASE_BASE_URL = window.SUPABASE_URL;
    const SUPABASE_API_KEY = window.SUPABASE_ANON_KEY || window.SUPABASE_KEY;

    /*
      Se os nomes das tabelas no teu projeto forem outros,
      altera apenas estas duas constantes.
    */
    const TABLE_HUNTS = 'hunts';
    const TABLE_BONUSES = 'hunt_bonuses';

    const headers = {
      apikey: SUPABASE_API_KEY,
      Authorization: `Bearer ${SUPABASE_API_KEY}`,
      'Content-Type': 'application/json'
    };

    const els = {
      huntName: document.getElementById('huntName'),
      huntId: document.getElementById('huntId'),
      huntStatus: document.getElementById('huntStatus'),
      statTotal: document.getElementById('statTotal'),
      statDone: document.getElementById('statDone'),
      statPending: document.getElementById('statPending'),
      bonusTrack: document.getElementById('bonusTrack'),
      bonusViewport: document.getElementById('bonusViewport')
    };

    let activeHuntId = null;
    let lastSignature = '';
    let scrollRaf = null;
    let scrollOffset = 0;
    let firstListHeight = 0;
    let isScrolling = false;
    let lastTs = 0;

    const SCROLL_SPEED = 28; // px por segundo

    function normalizeStatus(value) {
      const raw = String(value || '').trim().toLowerCase();

      if (
        raw === 'done' ||
        raw === 'completed' ||
        raw === 'complete' ||
        raw === 'feito' ||
        raw === 'fechado' ||
        raw === 'closed'
      ) {
        return 'feito';
      }

      if (
        raw === 'active' ||
        raw === 'ativo' ||
        raw === 'activa' ||
        raw === 'ativa' ||
        raw === 'running'
      ) {
        return 'ativo';
      }

      if (
        raw === 'cancelled' ||
        raw === 'canceled' ||
        raw === 'cancelado'
      ) {
        return 'cancelado';
      }

      return 'pendente';
    }

    function formatStatusLabel(status) {
      switch (status) {
        case 'feito': return 'Feito';
        case 'ativo': return 'Ativo';
        case 'cancelado': return 'Cancelado';
        default: return 'Pendente';
      }
    }

    function getBonusName(bonus) {
      return (
        bonus.slot_name ||
        bonus.name ||
        bonus.slot ||
        bonus.title ||
        bonus.slot_id ||
        `Bónus #${bonus.id ?? ''}`
      );
    }

    function getBonusSub(bonus) {
      const parts = [];

      if (bonus.slot_id) parts.push(`ID: ${bonus.slot_id}`);
      if (bonus.provider) parts.push(bonus.provider);
      if (bonus.game_name) parts.push(bonus.game_name);

      return parts.join(' • ');
    }

    function stopAutoScroll() {
      if (scrollRaf) {
        cancelAnimationFrame(scrollRaf);
        scrollRaf = null;
      }
      scrollOffset = 0;
      firstListHeight = 0;
      isScrolling = false;
      lastTs = 0;
      els.bonusTrack.style.transform = 'translateY(0px)';
    }

    function autoScrollStep(ts) {
      if (!isScrolling) return;

      if (!lastTs) lastTs = ts;
      const dt = (ts - lastTs) / 1000;
      lastTs = ts;

      scrollOffset += SCROLL_SPEED * dt;

      if (scrollOffset >= firstListHeight) {
        scrollOffset = 0;
      }

      els.bonusTrack.style.transform = `translateY(-${scrollOffset}px)`;
      scrollRaf = requestAnimationFrame(autoScrollStep);
    }

    function startAutoScrollIfNeeded() {
      stopAutoScroll();

      const lists = els.bonusTrack.querySelectorAll('.bonusList');
      if (!lists.length) return;

      const firstList = lists[0];
      firstListHeight = firstList.offsetHeight;

      const viewportHeight = els.bonusViewport.clientHeight;

      if (firstListHeight <= viewportHeight) {
        els.bonusTrack.style.transform = 'translateY(0px)';
        return;
      }

      isScrolling = true;
      scrollRaf = requestAnimationFrame(autoScrollStep);
    }

    function renderEmpty(message) {
      stopAutoScroll();
      els.huntName.textContent = message;
      els.huntId.textContent = 'ID: —';
      els.huntStatus.textContent = 'Estado: —';
      els.statTotal.textContent = '0';
      els.statDone.textContent = '0';
      els.statPending.textContent = '0';
      els.bonusTrack.innerHTML = `<div class="emptyState">${message}</div>`;
    }

    function renderOverlay(hunt, bonuses) {
      const total = bonuses.length;
      const done = bonuses.filter(b => normalizeStatus(b.status) === 'feito').length;
      const pending = bonuses.filter(b => normalizeStatus(b.status) !== 'feito').length;

      els.huntName.textContent = hunt.name || `Hunt #${hunt.id}`;
      els.huntId.textContent = `ID: ${hunt.id ?? '—'}`;
      els.huntStatus.textContent = 'Estado: Ativa';

      els.statTotal.textContent = String(total);
      els.statDone.textContent = String(done);
      els.statPending.textContent = String(pending);

      if (!bonuses.length) {
        stopAutoScroll();
        els.bonusTrack.innerHTML = `<div class="emptyState">Sem bónus nesta hunt.</div>`;
        return;
      }

      const listHtml = `
        <div class="bonusList">
          ${bonuses.map((bonus) => {
            const status = normalizeStatus(bonus.status);
            const bonusName = getBonusName(bonus);
            const bonusSub = getBonusSub(bonus);

            return `
              <div class="bonusItem">
                <div class="bonusLeft">
                  <div class="bonusName">${escapeHtml(bonusName)}</div>
                  <div class="bonusSub">${bonusSub ? escapeHtml(bonusSub) : '&nbsp;'}</div>
                </div>
                <div class="bonusStatus status-${status}">
                  ${formatStatusLabel(status)}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;

      /*
        Duplicamos a lista 2x para criar scroll infinito suave.
      */
      els.bonusTrack.innerHTML = listHtml + listHtml;

      requestAnimationFrame(() => {
        startAutoScrollIfNeeded();
      });
    }

    async function fetchJson(url) {
      const res = await fetch(url, { headers });

      if (!res.ok) {
        const text = await res.text().catch(() => '');
        throw new Error(`Erro ${res.status}: ${text || 'fetch falhou'}`);
      }

      return res.json();
    }

    async function getActiveHunt() {
      const url = `${SUPABASE_BASE_URL}/rest/v1/${TABLE_HUNTS}?select=*&is_active=eq.true&order=created_at.desc&limit=1`;
      const data = await fetchJson(url);
      return data?.[0] || null;
    }

    async function getBonusesByHunt(huntId) {
      const url = `${SUPABASE_BASE_URL}/rest/v1/${TABLE_BONUSES}?select=*&hunt_id=eq.${encodeURIComponent(huntId)}&order=created_at.asc`;
      return await fetchJson(url);
    }

    function buildSignature(hunt, bonuses) {
      return JSON.stringify({
        huntId: hunt?.id ?? null,
        huntName: hunt?.name ?? '',
        bonuses: bonuses.map(b => ({
          id: b.id ?? null,
          name: getBonusName(b),
          status: normalizeStatus(b.status),
          slot_id: b.slot_id ?? null
        }))
      });
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    async function refreshOverlay() {
      try {
        if (!SUPABASE_BASE_URL || !SUPABASE_API_KEY) {
          throw new Error('SUPABASE_URL ou SUPABASE_API_KEY não encontrados no conexao.js');
        }

        const hunt = await getActiveHunt();

        if (!hunt) {
          activeHuntId = null;
          lastSignature = '';
          renderEmpty('Sem hunt ativa.');
          return;
        }

        activeHuntId = hunt.id;
        const bonuses = await getBonusesByHunt(activeHuntId);

        const signature = buildSignature(hunt, bonuses);
        if (signature === lastSignature) return;

        lastSignature = signature;
        renderOverlay(hunt, bonuses);
      } catch (error) {
        console.error('[OVERLAY ERROR]', error);
        renderEmpty('Erro ao carregar overlay.');
      }
    }

    refreshOverlay();
    setInterval(refreshOverlay, 4000);
  </script>
</body>
</html>
