<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>CT Overlay</title>
<style>
body {
  width:1080px; height:1920px;
  margin:0; background:linear-gradient(180deg,#4F3EC7,#362A7A);
  color:#FFF; font-family:'Poppins',sans-serif; text-align:center;
  overflow:hidden;
}
#title{font-size:40px;color:#FFD54A;margin-top:30px;}
#bonus-list{height:1600px;overflow-y:auto;margin-top:20px;}
.card{margin:12px 40px;padding:15px;background:rgba(0,0,0,0.25);
border-radius:10px;}
.super{color:#FFD54A;} .épico{color:#FF5C5C;}
</style>
</head>
<body>
  <div id="title">CT 🎯</div>
  <div id="bonus-list"></div>

<script src="../admin/conexao.js"></script>
<script>
async function carregarBonus(){
  const resp=await fetch(`${SUPABASE_URL}/rest/v1/bonus?select=*`,{headers});
  const dados=await resp.json();
  const lista=document.getElementById("bonus-list"); lista.innerHTML="";
  dados.forEach(b=>{
    const div=document.createElement("div");
    div.className="card";
    div.innerHTML=`<b>${b.nome}</b> — ${b.aposta||0}€
    <span class="${b.tipo?.toLowerCase()}">${b.tipo||""}</span>`;
    lista.appendChild(div);
  });
}
setInterval(carregarBonus,3000);
carregarBonus();
</script>
</body>
</html>
