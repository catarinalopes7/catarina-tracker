<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>Catarina Tracker Overlay</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 1080px;
      height: 1920px;
      margin: 0;
      overflow: hidden;
      font-family: 'Rajdhani', Arial, sans-serif;
      color: #ffffff;
      background: transparent;
    }

    body {
      padding: 0;
    }

    #app {
      width: 372px;
      height: 1920px;
      padding: 8px 10px 8px 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: linear-gradient(180deg, #1a0b3d 0%, #32126f 58%, #1a0b3d 100%);
      border-right: 2px solid rgba(255,255,255,0.06);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.03) inset;
    }

    .panel {
      background: linear-gradient(180deg, #52259c 0%, #2c145d 100%);
      border-radius: 20px;
      border: 2px solid rgba(160, 124, 255, 0.34);
      box-shadow:
        0 12px 26px rgba(0,0,0,0.34),
        inset 0 1px 0 rgba(255,255,255,0.08);
      overflow: hidden;
      flex-shrink: 0;
    }

    .top-panel {
      padding: 10px 10px 8px;
    }

    .top-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .top-head-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .logo-badge {
      width: 28px;
      height: 28px;
      min-width: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #44b2ff;
      color: #44b2ff;
      box-shadow: 0 0 10px rgba(68,178,255,0.18);
      font-weight: 700;
      font-size: 15px;
      line-height: 1;
    }

    .head-text {
      min-width: 0;
      flex: 1;
    }

    .head-title {
      font-size: 22px;
      line-height: 1;
      font-weight: 700;
      text-transform: uppercase;
      color: #ffffff;
      letter-spacing: 0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .head-sub {
      margin-top: 3px;
      font-size: 11px;
      line-height: 1;
      font-weight: 700;
      text-transform: uppercase;
      color: rgba(255,255,255,0.72);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .head-id {
      font-size: 24px;
      line-height: 1;
      font-weight: 700;
      color: rgba(255,255,255,0.55);
      text-transform: uppercase;
      align-self: flex-start;
      padding-top: 1px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 7px;
    }

    .stat-box {
      min-height: 58px;
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(88,44,165,0.98), rgba(48,24,102,0.98));
      border: 1px solid rgba(255,255,255,0.06);
      padding: 7px 8px 6px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .stat-top {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 5px;
      color: rgba(255,255,255,0.80);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15px;
      line-height: 1;
    }

    .stat-icon {
      width: 12px;
      text-align: center;
      opacity: 0.86;
      font-size: 11px;
    }

    .stat-value {
      font-size: 28px;
      line-height: 1;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.3px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.22);
    }

    .stat-value.small {
      font-size: 24px;
    }

    .type-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 7px;
    }

    .type-pill {
      min-height: 28px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 10px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
    }

    .type-pill .left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .type-pill .count {
      font-size: 13px;
      line-height: 1;
    }

    .type-pill.super {
      background: linear-gradient(180deg, rgba(215, 177, 89, 0.22), rgba(166, 126, 33, 0.16));
      border: 1px solid rgba(225, 189, 96, 0.28);
      color: #f8e4aa;
    }

    .type-pill.epic {
      background: linear-gradient(180deg, rgba(180, 92, 123, 0.20), rgba(126, 45, 73, 0.14));
      border: 1px solid rgba(198, 104, 136, 0.26);
      color: #ffd8e4;
    }

    .progress-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 5px;
    }

    .progress-track {
      flex: 1;
      height: 10px;
      border-radius: 999px;
      background: rgba(7, 11, 33, 0.55);
      overflow: hidden;
      box-shadow:
        inset 0 2px 4px rgba(0,0,0,0.28),
        inset 0 1px 0 rgba(255,255,255,0.04);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #4fb2ff 0%, #2d7dff 100%);
      transition: width 0.35s ease;
      box-shadow: 0 0 10px rgba(79,178,255,0.20);
    }

    .progress-count {
      min-width: 52px;
      text-align: right;
      font-size: 20px;
      line-height: 1;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.2px;
    }

    .slots-panel {
      flex: 1;
      min-height: 0;
      padding: 6px;
    }

    .slots-viewport {
      height: 100%;
      overflow: hidden;
      position: relative;
    }

    .slots-track {
      will-change: transform;
      transform: translateY(0px);
    }

    .slots-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .slots-gap {
      height: 10px;
      flex-shrink: 0;
    }

    .slot-card {
      background: linear-gradient(180deg, #43208a 0%, #271353 100%);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.06);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.05),
        0 8px 18px rgba(0,0,0,0.18);
      overflow: hidden;
      transition: 0.22s ease;
    }

    .slot-card.opened {
      opacity: 0.44;
    }

    .slot-card.current {
      opacity: 1;
      border-color: rgba(255, 211, 84, 0.65);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.06),
        0 8px 18px rgba(0,0,0,0.20),
        0 0 0 2px rgba(255, 211, 84, 0.14);
    }

    .slot-head {
      padding: 8px 10px 6px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .slot-head-left {
      min-width: 0;
      flex: 1;
    }

    .slot-name {
      font-size: 24px;
      line-height: 0.97;
      font-weight: 700;
      font-style: italic;
      text-transform: uppercase;
      color: #eef3ff;
      letter-spacing: -0.25px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.28);
      word-break: break-word;
    }

    .slot-bet {
      margin-top: 4px;
      font-size: 20px;
      line-height: 1;
      font-weight: 700;
      color: #f2f6ff;
      opacity: 0.95;
    }

    .slot-rank {
      font-size: 22px;
      line-height: 1;
      font-weight: 700;
      color: rgba(255,255,255,0.72);
      flex-shrink: 0;
      padding-top: 1px;
    }

    .slot-image-wrap {
      padding: 0 8px 8px;
    }

    .slot-image-box {
      width: 100%;
      aspect-ratio: 0.88 / 1;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.05),
        0 4px 10px rgba(0,0,0,0.16);
    }

    .slot-image-box img,
    .slot-placeholder {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      object-position: center center;
    }

    .slot-image-box img {
      filter: saturate(0.88) brightness(0.88) contrast(0.96);
      transform: scale(0.975);
    }

    .slot-image-box::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(10, 8, 24, 0.02), rgba(10, 8, 24, 0.18)),
        radial-gradient(circle at top, rgba(255,255,255,0.08), transparent 45%);
      pointer-events: none;
    }

    .slot-placeholder {
      display: flex !important;
      align-items: center;
      justify-content: center;
      padding: 12px;
      text-align: center;
      font-size: 16px;
      line-height: 1.1;
      font-weight: 700;
      text-transform: uppercase;
      color: rgba(255,255,255,0.58);
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
    }

    .bottom-panel {
      padding: 8px;
    }

    .bottom-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 6px;
    }

    .bottom-grid.one {
      grid-template-columns: 1fr;
      margin-bottom: 0;
    }

    .bottom-box {
      min-height: 56px;
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(88,44,165,0.98), rgba(48,24,102,0.98));
      border: 1px solid rgba(255,255,255,0.06);
      padding: 7px 8px 6px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }

    .bottom-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      margin-bottom: 5px;
      font-size: 11px;
      line-height: 1;
      font-weight: 700;
      text-transform: uppercase;
      color: rgba(255,255,255,0.80);
    }

    .bottom-value {
      font-size: 24px;
      line-height: 1;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.2px;
    }

    .empty-state {
      height: 100%;
      border-radius: 16px;
      background: linear-gradient(180deg, #43208a 0%, #271353 100%);
      border: 1px solid rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 22px;
      font-size: 18px;
      line-height: 1.15;
      font-weight: 700;
      text-transform: uppercase;
      color: rgba(255,255,255,0.72);
    }
  </style>
</head>

<body>
  <div id="app">
    <div class="panel top-panel">
      <div class="top-head">
        <div class="top-head-left">
          <div class="logo-badge">◔</div>

          <div class="head-text">
            <div id="huntLabel" class="head-title">BONUS HUNT</div>
            <div id="huntSub" class="head-sub">A carregar...</div>
          </div>
        </div>

        <div id="huntId" class="head-id">#---</div>
      </div>

      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-top">
            <span class="stat-icon">▣</span>
            <span>Start</span>
          </div>
          <div id="start" class="stat-value small">$0.00</div>
        </div>

        <div class="stat-box">
          <div class="stat-top">
            <span class="stat-icon">▣</span>
            <span>Breakeven</span>
          </div>
          <div id="topBreakeven" class="stat-value small">0.00x</div>
        </div>

        <div class="stat-box">
          <div class="stat-top">
            <span class="stat-icon">▣</span>
            <span>Bonuses</span>
          </div>
          <div id="total" class="stat-value">0</div>
        </div>

        <div class="stat-box">
          <div class="stat-top">
            <span class="stat-icon">▣</span>
            <span>Opening</span>
          </div>
          <div id="open" class="stat-value">0/0</div>
        </div>
      </div>

      <div class="type-row">
        <div class="type-pill super">
          <div class="left">
            <span>⚡</span>
            <span>Super</span>
          </div>
          <span id="superCount" class="count">0</span>
        </div>

        <div class="type-pill epic">
          <div class="left">
            <span>✦</span>
            <span>Epic</span>
          </div>
          <span id="epicCount" class="count">0</span>
        </div>
      </div>

      <div class="progress-row">
        <div class="progress-track">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <div id="progressCount" class="progress-count">0/0</div>
      </div>
    </div>

    <div class="panel slots-panel">
      <div id="slotsViewport" class="slots-viewport">
        <div id="slotsTrack" class="slots-track">
          <div class="empty-state">A carregar slots...</div>
        </div>
      </div>
    </div>

    <div class="panel bottom-panel">
      <div class="bottom-grid">
        <div class="bottom-box">
          <div class="bottom-label">
            <span>◔</span>
            <span>Average</span>
          </div>
          <div id="avg" class="bottom-value">0.00x</div>
        </div>

        <div class="bottom-box">
          <div class="bottom-label">
            <span>▣</span>
            <span>Breakeven</span>
          </div>
          <div id="bottomBreakeven" class="bottom-value">0.00x</div>
        </div>
      </div>

      <div class="bottom-grid one">
        <div class="bottom-box">
          <div class="bottom-label">
            <span>◌</span>
            <span>Total Pay</span>
          </div>
          <div id="totalPaid" class="bottom-value">$0.00</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://cwengomkuhqvrdcpkgwp.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Hi1T9WK_snEgqPep5JJnRQ__HSJXQUs";

    let slotsCatalogCache = [];
    let slotsCatalogLoaded = false;

    let scrollAnimationId = null;
    let scrollOffset = 0;
    let scrollSingleHeight = 0;
    let scrollLastTimestamp = 0;
    let scrollPauseUntil = 0;
    let lastRenderedSignature = "";

    const SCROLL_GAP = 10;
    const SCROLL_SPEED = 13;
    const SCROLL_START_PAUSE = 1200;
    const SCROLL_LOOP_PAUSE = 900;

    function parseMoney(value) {
      if (value === null || value === undefined) return 0;
      const str = String(value).trim().replace(",", ".");
      const num = parseFloat(str);
      return isNaN(num) ? 0 : num;
    }

    function normalizeText(text) {
      return String(text || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]/g, "");
    }

    function getStartFromHunt(hunt) {
      const startBalance = parseMoney(hunt?.start_balance);
      const startValue = parseMoney(hunt?.start_value);

      if (startBalance > 0) return startBalance;
      if (startValue > 0) return startValue;
      return 0;
    }

    function formatCurrency(value) {
      const num = parseMoney(value);
      const sign = num < 0 ? "-" : "";
      return sign + "$" + Math.abs(num).toFixed(2);
    }

    function formatMultiplier(value) {
      return parseMoney(value).toFixed(2) + "x";
    }

    function escapeHtml(text) {
      return String(text ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function getBonusTypeLabel(item) {
      const raw = String(
        item?.bonus_type ||
        item?.type ||
        item?.categoria ||
        item?.rarity ||
        item?.tipo_slot ||
        ""
      ).trim().toLowerCase();

      if (raw.includes("super")) return "super";
      if (raw.includes("epic")) return "epic";
      if (raw.includes("extreme")) return "epic";
      return "normal";
    }

    function getBonusName(item) {
      return item?.slot_name || item?.nome || item?.name || "Sem nome";
    }

    function getBonusBet(item) {
      return parseMoney(
        item?.bet_size ??
        item?.bet ??
        item?.aposta ??
        0
      );
    }

    function getBonusPayout(item) {
      return parseMoney(
        item?.payout ??
        item?.valor_pago ??
        item?.total_pago ??
        0
      );
    }

    function getBonusMulti(item) {
      const bet = getBonusBet(item);
      const payout = getBonusPayout(item);
      if (bet <= 0) return 0;
      return payout / bet;
    }

    function getTotalBetAmount(items) {
      return items.reduce((sum, item) => sum + getBonusBet(item), 0);
    }

    function getBreakevenX(startValue, items) {
      const totalBet = getTotalBetAmount(items);
      if (startValue <= 0 || totalBet <= 0) return 0;
      return startValue / totalBet;
    }

    async function loadSlotsCatalog() {
      if (slotsCatalogLoaded) return slotsCatalogCache;

      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/slots?select=name,nome,image_url,imagem_url,image,thumbnail,thumb,cover,slug,tipo_slot`,
        {
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: `Bearer ${SUPABASE_KEY}`
          }
        }
      );

      const data = await res.json();
      slotsCatalogCache = Array.isArray(data) ? data : [];
      slotsCatalogLoaded = true;
      return slotsCatalogCache;
    }

    function getCatalogMatch(item) {
      const itemName = normalizeText(getBonusName(item));
      if (!itemName || !slotsCatalogCache.length) return null;

      let exact = slotsCatalogCache.find(slot => {
        const slotName = normalizeText(slot?.name || slot?.nome || "");
        return slotName === itemName;
      });

      if (exact) return exact;

      let slugMatch = slotsCatalogCache.find(slot => {
        const slug = normalizeText(slot?.slug || "");
        return slug === itemName;
      });

      return slugMatch || null;
    }

    function getImageFromBonus(item) {
      const direct =
        item?.image_url ||
        item?.imagem_url ||
        item?.image ||
        item?.thumbnail ||
        item?.thumb ||
        item?.cover ||
        "";

      if (direct) return direct;

      const catalog = getCatalogMatch(item);
      if (!catalog) return "";

      return (
        catalog?.image_url ||
        catalog?.imagem_url ||
        catalog?.image ||
        catalog?.thumbnail ||
        catalog?.thumb ||
        catalog?.cover ||
        ""
      );
    }

    function stopAutoScroll() {
      if (scrollAnimationId) {
        cancelAnimationFrame(scrollAnimationId);
        scrollAnimationId = null;
      }

      scrollOffset = 0;
      scrollSingleHeight = 0;
      scrollLastTimestamp = 0;
      scrollPauseUntil = 0;

      const track = document.getElementById("slotsTrack");
      if (track) {
        track.style.transform = "translateY(0px)";
      }
    }

    function buildSlotsSignature(items, latestOpenedIndex) {
      return JSON.stringify({
        latestOpenedIndex,
        items: items.map(item => ({
          id: item?.id ?? null,
          name: getBonusName(item),
          bet: getBonusBet(item),
          payout: getBonusPayout(item),
          type: getBonusTypeLabel(item),
          image: getImageFromBonus(item)
        }))
      });
    }

    function startAutoScrollIfNeeded() {
      stopAutoScroll();

      const viewport = document.getElementById("slotsViewport");
      const track = document.getElementById("slotsTrack");
      const firstGroup = track.querySelector(".slots-group");

      if (!viewport || !track || !firstGroup) return;

      const viewportHeight = viewport.clientHeight;
      const contentHeight = firstGroup.offsetHeight;

      if (contentHeight <= viewportHeight + 2) {
        track.style.transform = "translateY(0px)";
        return;
      }

      scrollSingleHeight = contentHeight + SCROLL_GAP;
      scrollPauseUntil = performance.now() + SCROLL_START_PAUSE;

      function animate(timestamp) {
        if (!scrollLastTimestamp) {
          scrollLastTimestamp = timestamp;
        }

        const delta = (timestamp - scrollLastTimestamp) / 1000;
        scrollLastTimestamp = timestamp;

        if (timestamp >= scrollPauseUntil) {
          scrollOffset += SCROLL_SPEED * delta;

          if (scrollOffset >= scrollSingleHeight) {
            scrollOffset = 0;
            scrollPauseUntil = timestamp + SCROLL_LOOP_PAUSE;
          }
        }

        track.style.transform = `translateY(-${scrollOffset}px)`;
        scrollAnimationId = requestAnimationFrame(animate);
      }

      scrollAnimationId = requestAnimationFrame(animate);
    }

    function renderSlots(items, latestOpenedIndex = -1, force = false) {
      const track = document.getElementById("slotsTrack");
      const signature = buildSlotsSignature(items, latestOpenedIndex);

      if (!force && signature === lastRenderedSignature) {
        return;
      }

      lastRenderedSignature = signature;
      stopAutoScroll();

      if (!items.length) {
        track.innerHTML = '<div class="empty-state">Sem bónus nesta hunt</div>';
        return;
      }

      const cardsHtml = items.map((item, index) => {
        const name = getBonusName(item);
        const bet = getBonusBet(item);
        const img = getImageFromBonus(item);
        const payout = getBonusPayout(item);

        const classes = [
          "slot-card",
          payout > 0 ? "opened" : "",
          index === latestOpenedIndex ? "current" : ""
        ].filter(Boolean).join(" ");

        return `
          <div class="${classes}">
            <div class="slot-head">
              <div class="slot-head-left">
                <div class="slot-name">${escapeHtml(name)}</div>
                <div class="slot-bet">${formatCurrency(bet)}</div>
              </div>
              <div class="slot-rank">#${index + 1}</div>
            </div>

            <div class="slot-image-wrap">
              <div class="slot-image-box">
                ${
                  img
                    ? `<img src="${escapeHtml(img)}" alt="${escapeHtml(name)}" />`
                    : `<div class="slot-placeholder">Sem imagem</div>`
                }
              </div>
            </div>
          </div>
        `;
      }).join("");

      track.innerHTML = `
        <div class="slots-group">${cardsHtml}</div>
        <div class="slots-gap"></div>
        <div class="slots-group">${cardsHtml}</div>
      `;

      requestAnimationFrame(() => {
        startAutoScrollIfNeeded();
      });
    }

    function resetOverlayNoHunt(message = "Sem hunt ativa") {
      stopAutoScroll();
      lastRenderedSignature = "";
      document.getElementById("huntLabel").innerText = "BONUS HUNT";
      document.getElementById("huntSub").innerText = message;
      document.getElementById("huntId").innerText = "#---";
      document.getElementById("start").innerText = "$0.00";
      document.getElementById("topBreakeven").innerText = "0.00x";
      document.getElementById("bottomBreakeven").innerText = "0.00x";
      document.getElementById("avg").innerText = "0.00x";
      document.getElementById("totalPaid").innerText = "$0.00";
      document.getElementById("total").innerText = "0";
      document.getElementById("superCount").innerText = "0";
      document.getElementById("epicCount").innerText = "0";
      document.getElementById("open").innerText = "0/0";
      document.getElementById("progressCount").innerText = "0/0";
      document.getElementById("progressFill").style.width = "0%";
      document.getElementById("slotsTrack").innerHTML = `<div class="empty-state">${message}</div>`;
    }

    async function load() {
      try {
        const huntRes = await fetch(
          `${SUPABASE_URL}/rest/v1/hunts?select=*&is_active=eq.true&order=id.desc&limit=1`,
          {
            headers: {
              apikey: SUPABASE_KEY,
              Authorization: `Bearer ${SUPABASE_KEY}`
            }
          }
        );

        const huntData = await huntRes.json();
        const hunt = Array.isArray(huntData) ? huntData[0] : null;

        if (!hunt) {
          resetOverlayNoHunt("Sem hunt ativa");
          return;
        }

        await loadSlotsCatalog();

        const huntSlotsRes = await fetch(
          `${SUPABASE_URL}/rest/v1/hunt_slots?select=*&hunt_id=eq.${hunt.id}&order=id.asc`,
          {
            headers: {
              apikey: SUPABASE_KEY,
              Authorization: `Bearer ${SUPABASE_KEY}`
            }
          }
        );

        const huntSlotsData = await huntSlotsRes.json();
        const bonuses = Array.isArray(huntSlotsData) ? huntSlotsData : [];

        const startValue = getStartFromHunt(hunt);
        const total = bonuses.length;
        const totalPaid = bonuses.reduce((sum, b) => sum + getBonusPayout(b), 0);
        const opened = bonuses
          .map((bonus, index) => ({ bonus, index }))
          .filter(item => getBonusPayout(item.bonus) > 0);

        const latestOpened = opened.length ? opened[opened.length - 1] : null;

        let superCount = 0;
        let epicCount = 0;

        for (const bonus of bonuses) {
          const type = getBonusTypeLabel(bonus);
          if (type === "super") superCount++;
          if (type === "epic") epicCount++;
        }

        const topBreakevenX = getBreakevenX(startValue, bonuses);
        const openedCount = opened.length;
        const avgMulti = openedCount > 0
          ? opened.reduce((sum, item) => sum + getBonusMulti(item.bonus), 0) / openedCount
          : 0;

        document.getElementById("huntLabel").innerText = "BONUS HUNT";
        document.getElementById("huntSub").innerText = (hunt.nome || "Sem nome").toUpperCase();
        document.getElementById("huntId").innerText = "#" + hunt.id;
        document.getElementById("start").innerText = formatCurrency(startValue);
        document.getElementById("topBreakeven").innerText = formatMultiplier(topBreakevenX);
        document.getElementById("bottomBreakeven").innerText = formatMultiplier(topBreakevenX);
        document.getElementById("avg").innerText = formatMultiplier(avgMulti);
        document.getElementById("totalPaid").innerText = formatCurrency(totalPaid);
        document.getElementById("total").innerText = total;
        document.getElementById("superCount").innerText = superCount;
        document.getElementById("epicCount").innerText = epicCount;
        document.getElementById("open").innerText = opened.length + "/" + total;
        document.getElementById("progressCount").innerText = `${opened.length}/${total}`;

        const progress = total > 0 ? (opened.length / total) * 100 : 0;
        document.getElementById("progressFill").style.width = progress + "%";

        renderSlots(bonuses, latestOpened?.index ?? -1);
      } catch (e) {
        console.log(e);
        resetOverlayNoHunt("Erro overlay");
      }
    }

    window.addEventListener("resize", () => {
      requestAnimationFrame(() => startAutoScrollIfNeeded());
    });

    setInterval(load, 2000);
    load();
  </script>
</body>
</html>
