<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>Catarina Tracker Overlay</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg-top: #4f3ec7;
      --bg-bottom: #2b1d74;
      --panel-top: rgba(56, 40, 118, 0.96);
      --panel-bottom: rgba(37, 24, 87, 0.96);
      --card-top: rgba(82, 61, 170, 0.95);
      --card-bottom: rgba(51, 33, 120, 0.95);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-main: #ffffff;
      --text-soft: rgba(255, 255, 255, 0.76);
      --title-yellow: #ffd54a;
      --blue: #49a7ff;
      --green: #4ee48c;
      --orange: #ffb347;
      --red: #ff6b81;
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.26);
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 18px;
    }

    html,
    body {
      width: 1080px;
      height: 1920px;
      margin: 0;
      overflow: hidden;
      font-family: "Outfit", Arial, sans-serif;
      color: var(--text-main);
      background:
        radial-gradient(circle at top, rgba(255,255,255,0.10), transparent 28%),
        linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    }

    body {
      padding: 22px;
    }

    #app {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
    }

    .overlay-shell {
      width: 760px;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .top-panel {
      background: linear-gradient(180deg, var(--panel-top), var(--panel-bottom));
      border-radius: var(--radius-xl);
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow: var(--shadow);
      padding: 20px 20px 18px;
      backdrop-filter: blur(8px);
    }

    .hunt-header {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }

    .hunt-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .hunt-title {
      font-size: 44px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: 0.2px;
      color: var(--title-yellow);
      text-shadow: 0 4px 14px rgba(0,0,0,0.28);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hunt-subtitle {
      font-size: 18px;
      font-weight: 500;
      color: var(--text-soft);
      letter-spacing: 0.25px;
      min-height: 22px;
    }

    .progress-wrap {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 2px;
    }

    .progress-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 18px;
      color: var(--text-soft);
      font-weight: 600;
    }

    .progress-bar {
      width: 100%;
      height: 18px;
      background: rgba(255,255,255,0.10);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.18);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #2f8cff 0%, #57bbff 100%);
      box-shadow: 0 0 14px rgba(73, 167, 255, 0.45);
      transition: width 0.35s ease;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-top: 16px;
    }

    .stat-card {
      min-height: 94px;
      background: linear-gradient(180deg, var(--card-top), var(--card-bottom));
      border-radius: 20px;
      border: 1px solid var(--card-border);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
    }

    .stat-card.big {
      min-height: 102px;
      padding: 14px 16px;
    }

    .stat-card.super {
      grid-column: span 2;
    }

    .stat-card.epic {
      grid-column: span 2;
    }

    .stat-label {
      font-size: 16px;
      font-weight: 700;
      color: rgba(255,255,255,0.74);
      text-transform: uppercase;
      letter-spacing: 0.9px;
      white-space: nowrap;
    }

    .stat-value {
      font-size: 30px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stat-value.small-fit {
      font-size: 27px;
    }

    .stat-value.blue { color: #8fd0ff; }
    .stat-value.green { color: #74f0a7; }
    .stat-value.orange { color: #ffc56f; }
    .stat-value.red { color: #ff96a8; }
    .stat-value.yellow { color: #ffe07d; }

    .list-panel {
      flex: 1;
      min-height: 0;
      background: linear-gradient(180deg, rgba(47, 30, 106, 0.96), rgba(31, 20, 74, 0.96));
      border-radius: var(--radius-xl);
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(8px);
    }

    .list-header {
      padding: 16px 18px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .list-title {
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.2px;
    }

    .list-counter {
      font-size: 17px;
      font-weight: 700;
      color: rgba(255,255,255,0.76);
    }

    .slots-scroll {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      position: relative;
    }

    .slots-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px 14px 18px;
      will-change: transform;
    }

    .slot-card {
      min-height: 128px;
      display: grid;
      grid-template-columns: 118px minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      padding: 12px;
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(93, 70, 184, 0.94), rgba(55, 35, 129, 0.96));
      border: 1px solid rgba(255,255,255,0.11);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
    }

    .slot-thumb {
      width: 118px;
      height: 104px;
      border-radius: 18px;
      overflow: hidden;
      position: relative;
      background:
        radial-gradient(circle at top, rgba(255,255,255,0.18), transparent 55%),
        linear-gradient(180deg, rgba(255,255,255,0.10), rgba(0,0,0,0.16));
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: inset 0 2px 10px rgba(0,0,0,0.16);
    }

    .slot-thumb img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center center;
      transform: scale(1.06);
    }

    .slot-thumb.fallback::before {
      content: "🎰";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 44px;
      opacity: 0.92;
    }

    .slot-info {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .slot-name {
      font-size: 27px;
      font-weight: 800;
      line-height: 1.04;
      letter-spacing: -0.01em;
      color: #ffffff;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }

    .slot-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      border: 1px solid rgba(255,255,255,0.10);
      white-space: nowrap;
    }

    .badge.normal {
      background: rgba(255,255,255,0.10);
      color: rgba(255,255,255,0.92);
    }

    .badge.super {
      background: rgba(255, 179, 71, 0.18);
      color: #ffd17f;
    }

    .badge.epic {
      background: rgba(255, 107, 129, 0.18);
      color: #ff9db0;
    }

    .badge.opened {
      background: rgba(78, 228, 140, 0.16);
      color: #8bf3b3;
    }

    .badge.pending {
      background: rgba(73, 167, 255, 0.16);
      color: #9fd6ff;
    }

    .slot-right {
      min-width: 132px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      gap: 10px;
      padding-right: 4px;
    }

    .slot-payout-label {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: rgba(255,255,255,0.66);
      text-transform: uppercase;
    }

    .slot-payout {
      font-size: 34px;
      font-weight: 800;
      line-height: 1;
      color: #79f1ad;
      text-shadow: 0 4px 12px rgba(0,0,0,0.22);
      white-space: nowrap;
    }

    .slot-pending-text {
      font-size: 18px;
      font-weight: 700;
      color: rgba(255,255,255,0.72);
      text-align: right;
      line-height: 1.1;
    }

    .empty-state,
    .loading-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      color: rgba(255,255,255,0.74);
      font-size: 28px;
      font-weight: 700;
      line-height: 1.3;
    }

    .footer-note {
      font-size: 15px;
      color: rgba(255,255,255,0.45);
      text-align: right;
      padding-top: 2px;
      padding-right: 6px;
    }

    .hide {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="overlay-shell">
      <section class="top-panel">
        <div class="hunt-header">
          <div class="hunt-title-row">
            <div id="huntTitle" class="hunt-title">Sem hunt ativa</div>
          </div>

          <div id="huntSubtitle" class="hunt-subtitle">À espera de dados...</div>

          <div class="progress-wrap">
            <div class="progress-meta">
              <span id="progressText">0 / 0 abertos</span>
              <span id="progressPct">0%</span>
            </div>
            <div class="progress-bar">
              <div id="progressFill" class="progress-fill"></div>
            </div>
          </div>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">Start</div>
            <div id="statStart" class="stat-value yellow">0€</div>
          </div>

          <div class="stat-card">
            <div class="stat-label">Breakeven</div>
            <div id="statBreakeven" class="stat-value blue">0%</div>
          </div>

          <div class="stat-card">
            <div class="stat-label">Bonuses</div>
            <div id="statBonuses" class="stat-value">0</div>
          </div>

          <div class="stat-card">
            <div class="stat-label">Opening</div>
            <div id="statOpening" class="stat-value blue">0/0</div>
          </div>

          <div class="stat-card big super">
            <div class="stat-label">Super</div>
            <div id="statSuper" class="stat-value orange">0</div>
          </div>

          <div class="stat-card big epic">
            <div class="stat-label">Epic</div>
            <div id="statEpic" class="stat-value red">0</div>
          </div>
        </div>
      </section>

      <section class="list-panel">
        <div class="list-header">
          <div class="list-title">Hunt</div>
          <div id="listCounter" class="list-counter">0 slots</div>
        </div>

        <div class="slots-scroll" id="slotsScroll">
          <div id="loadingState" class="loading-state">A carregar overlay...</div>
          <div id="emptyState" class="empty-state hide">Sem slots para mostrar.</div>
          <div id="slotsList" class="slots-list hide"></div>
        </div>
      </section>

      <div id="footerNote" class="footer-note">Catarina Tracker Overlay</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL =
      window.CT_SUPABASE_URL ||
      window.SUPABASE_URL ||
      window.ENV?.SUPABASE_URL ||
      localStorage.getItem("SUPABASE_URL") ||
      "";

    const SUPABASE_ANON_KEY =
      window.CT_SUPABASE_ANON_KEY ||
      window.SUPABASE_ANON_KEY ||
      window.ENV?.SUPABASE_ANON_KEY ||
      localStorage.getItem("SUPABASE_ANON_KEY") ||
      "";

    const refreshMs = 5000;
    const listEl = document.getElementById("slotsList");
    const loadingEl = document.getElementById("loadingState");
    const emptyEl = document.getElementById("emptyState");
    const scrollEl = document.getElementById("slotsScroll");

    const els = {
      huntTitle: document.getElementById("huntTitle"),
      huntSubtitle: document.getElementById("huntSubtitle"),
      progressText: document.getElementById("progressText"),
      progressPct: document.getElementById("progressPct"),
      progressFill: document.getElementById("progressFill"),
      listCounter: document.getElementById("listCounter"),
      statStart: document.getElementById("statStart"),
      statBreakeven: document.getElementById("statBreakeven"),
      statBonuses: document.getElementById("statBonuses"),
      statOpening: document.getElementById("statOpening"),
      statSuper: document.getElementById("statSuper"),
      statEpic: document.getElementById("statEpic")
    };

    let supabase = null;
    let autoScrollY = 0;
    let autoScrollDirection = 1;
    let lastRenderedSignature = "";

    function euro(value) {
      const n = Number(value || 0);
      return new Intl.NumberFormat("pt-PT", {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
      }).format(n) + "€";
    }

    function pct(value) {
      const n = Number(value || 0);
      return new Intl.NumberFormat("pt-PT", {
        minimumFractionDigits: 0,
        maximumFractionDigits: 1
      }).format(n) + "%";
    }

    function num(value) {
      return new Intl.NumberFormat("pt-PT").format(Number(value || 0));
    }

    function pick(obj, keys, fallback = null) {
      if (!obj) return fallback;
      for (const key of keys) {
        if (obj[key] !== undefined && obj[key] !== null && obj[key] !== "") {
          return obj[key];
        }
      }
      return fallback;
    }

    function isOpened(item) {
      const raw = String(
        pick(item, [
          "status",
          "state",
          "opening_status",
          "result_status"
        ], "")
      ).toLowerCase();

      if (raw) {
        return ["opened", "open", "done", "finished", "paid", "completed"].includes(raw);
      }

      if (pick(item, ["opened", "is_opened", "opened_bonus"], false) === true) return true;
      if (pick(item, ["opened_at", "completed_at", "finished_at"], null)) return true;

      const payout = Number(pick(item, ["payout", "result", "win_amount", "paid_amount"], 0) || 0);
      return payout > 0;
    }

    function normalizeBonusType(item) {
      const raw = String(
        pick(item, ["bonus_type", "type", "rarity", "tier"], "normal")
      ).toLowerCase();

      if (raw.includes("epic")) return "epic";
      if (raw.includes("super")) return "super";
      return "normal";
    }

    function normalizeSlot(item, index = 0) {
      return {
        id: pick(item, ["id", "slot_id", "bonus_id"], "slot-" + index),
        name: pick(item, ["slot_name", "name", "title", "slot"], "Slot"),
        image: pick(item, ["slot_image", "image_url", "image", "thumb", "thumbnail_url"], ""),
        type: normalizeBonusType(item),
        payout: Number(pick(item, ["payout", "result", "paid_amount", "win_amount"], 0) || 0),
        opened: isOpened(item),
        order:
          Number(
            pick(item, ["sort_order", "position", "display_order", "order_index"], index)
          ) || index
      };
    }

    async function tryGetActiveHunt() {
      const huntTables = ["hunts", "bonus_hunts", "hunt_sessions"];
      const strategies = [
        (q) => q.eq("is_active", true),
        (q) => q.eq("active", true),
        (q) => q.eq("status", "active")
      ];

      for (const table of huntTables) {
        for (const applyStrategy of strategies) {
          try {
            let query = supabase
              .from(table)
              .select("*")
              .order("updated_at", { ascending: false })
              .limit(1);

            query = applyStrategy(query);

            const { data, error } = await query;
            if (!error && Array.isArray(data) && data.length) {
              return { table, hunt: data[0] };
            }
          } catch (_) {}
        }

        try {
          const { data, error } = await supabase
            .from(table)
            .select("*")
            .order("updated_at", { ascending: false })
            .order("created_at", { ascending: false })
            .limit(10);

          if (!error && Array.isArray(data) && data.length) {
            const active = data.find((row) => {
              const isActive = pick(row, ["is_active", "active"], false) === true;
              const status = String(pick(row, ["status"], "")).toLowerCase() === "active";
              return isActive || status;
            });

            if (active) return { table, hunt: active };
          }
        } catch (_) {}
      }

      return null;
    }

    async function tryGetBonuses(huntId) {
      const bonusTables = ["hunt_entries", "hunt_items", "hunt_bonuses", "bonuses"];
      const possibleHuntKeys = ["hunt_id", "bonus_hunt_id", "session_id"];

      for (const table of bonusTables) {
        for (const huntKey of possibleHuntKeys) {
          try {
            const { data, error } = await supabase
              .from(table)
              .select("*")
              .eq(huntKey, huntId)
              .order("sort_order", { ascending: true })
              .order("position", { ascending: true })
              .order("created_at", { ascending: true });

            if (!error && Array.isArray(data)) {
              return data;
            }
          } catch (_) {}
        }
      }

      return [];
    }

    function computeStats(hunt, slots) {
      const start = Number(
        pick(hunt, ["start_balance", "start", "starting_balance", "hunt_start"], 0) || 0
      );

      const total = slots.length;
      const opened = slots.filter((s) => s.opened).length;
      const totalPaid = slots
        .filter((s) => s.opened)
        .reduce((sum, s) => sum + Number(s.payout || 0), 0);

      const breakevenPct = start > 0 ? (totalPaid / start) * 100 : 0;
      const superCount = slots.filter((s) => s.type === "super").length;
      const epicCount = slots.filter((s) => s.type === "epic").length;

      return {
        start,
        total,
        opened,
        totalPaid,
        breakevenPct,
        superCount,
        epicCount
      };
    }

    function setMainState(message) {
      loadingEl.textContent = message;
      loadingEl.classList.remove("hide");
      emptyEl.classList.add("hide");
      listEl.classList.add("hide");
      listEl.innerHTML = "";
    }

    function setEmptyState(message) {
      loadingEl.classList.add("hide");
      emptyEl.textContent = message;
      emptyEl.classList.remove("hide");
      listEl.classList.add("hide");
      listEl.innerHTML = "";
    }

    function renderHeader(hunt, stats) {
      const huntName = pick(hunt, ["name", "title"], "Sem hunt ativa");
      els.huntTitle.textContent = huntName;

      const subtitleParts = [];
      subtitleParts.push("Hunt ativa");
      if (stats.start > 0) subtitleParts.push("Start " + euro(stats.start));
      els.huntSubtitle.textContent = subtitleParts.join(" • ");

      const progress = stats.total > 0 ? (stats.opened / stats.total) * 100 : 0;
      els.progressText.textContent = `${num(stats.opened)} / ${num(stats.total)} abertos`;
      els.progressPct.textContent = pct(progress);
      els.progressFill.style.width = Math.max(0, Math.min(progress, 100)) + "%";

      els.statStart.textContent = euro(stats.start);
      els.statBreakeven.textContent = pct(stats.breakevenPct);
      els.statBonuses.textContent = num(stats.total);
      els.statOpening.textContent = `${num(stats.opened)}/${num(stats.total)}`;
      els.statSuper.textContent = num(stats.superCount);
      els.statEpic.textContent = num(stats.epicCount);
      els.listCounter.textContent = `${num(stats.total)} slots`;
    }

    function renderNoActiveHunt() {
      els.huntTitle.textContent = "Sem hunt ativa";
      els.huntSubtitle.textContent = "Ativa uma hunt no painel para aparecer aqui";
      els.progressText.textContent = "0 / 0 abertos";
      els.progressPct.textContent = "0%";
      els.progressFill.style.width = "0%";
      els.statStart.textContent = "0€";
      els.statBreakeven.textContent = "0%";
      els.statBonuses.textContent = "0";
      els.statOpening.textContent = "0/0";
      els.statSuper.textContent = "0";
      els.statEpic.textContent = "0";
      els.listCounter.textContent = "0 slots";
      setEmptyState("Sem hunt ativa.");
    }

    function slotCardTemplate(slot) {
      const badgeClass =
        slot.type === "epic" ? "epic" : slot.type === "super" ? "super" : "normal";

      const rightSide = slot.opened
        ? `
          <div class="slot-right">
            <div class="badge opened">Aberto</div>
            <div class="slot-payout-label">Payout</div>
            <div class="slot-payout">${euro(slot.payout)}</div>
          </div>
        `
        : `
          <div class="slot-right">
            <div class="badge pending">Pendente</div>
            <div class="slot-pending-text">À espera<br>de abrir</div>
          </div>
        `;

      const imageMarkup = slot.image
        ? `<img src="${slot.image}" alt="${escapeHtml(slot.name)}" onerror="this.parentNode.classList.add('fallback'); this.remove();" />`
        : "";

      return `
        <div class="slot-card">
          <div class="slot-thumb ${slot.image ? "" : "fallback"}">
            ${imageMarkup}
          </div>

          <div class="slot-info">
            <div class="slot-name">${escapeHtml(slot.name)}</div>
            <div class="slot-meta">
              <span class="badge ${badgeClass}">${slot.type}</span>
            </div>
          </div>

          ${rightSide}
        </div>
      `;
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function renderSlots(slots) {
      if (!slots.length) {
        setEmptyState("Esta hunt ainda não tem slots.");
        return;
      }

      const signature = JSON.stringify(
        slots.map((s) => [s.id, s.name, s.image, s.type, s.payout, s.opened, s.order])
      );

      if (signature !== lastRenderedSignature) {
        lastRenderedSignature = signature;
        listEl.innerHTML = slots.map(slotCardTemplate).join("");
      }

      loadingEl.classList.add("hide");
      emptyEl.classList.add("hide");
      listEl.classList.remove("hide");
    }

    function startAutoScroll() {
      const speed = 0.35;

      function step() {
        const maxScroll = Math.max(0, listEl.scrollHeight - scrollEl.clientHeight);
        if (maxScroll <= 0 || listEl.classList.contains("hide")) {
          listEl.style.transform = "translateY(0px)";
          autoScrollY = 0;
          requestAnimationFrame(step);
          return;
        }

        autoScrollY += speed * autoScrollDirection;

        if (autoScrollY >= maxScroll) {
          autoScrollY = maxScroll;
          autoScrollDirection = -1;
        } else if (autoScrollY <= 0) {
          autoScrollY = 0;
          autoScrollDirection = 1;
        }

        listEl.style.transform = `translateY(${-autoScrollY}px)`;
        requestAnimationFrame(step);
      }

      requestAnimationFrame(step);
    }

    async function loadOverlay() {
      if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
        els.huntTitle.textContent = "Configuração em falta";
        els.huntSubtitle.textContent = "Supabase URL / Key não encontrados";
        setMainState("Faltam as credenciais do Supabase neste overlay.");
        return;
      }

      if (!supabase) {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }

      try {
        const active = await tryGetActiveHunt();

        if (!active || !active.hunt) {
          renderNoActiveHunt();
          return;
        }

        const hunt = active.hunt;
        const huntId = pick(hunt, ["id"]);
        const rawBonuses = await tryGetBonuses(huntId);
        const slots = rawBonuses
          .map((item, index) => normalizeSlot(item, index))
          .sort((a, b) => a.order - b.order);

        const stats = computeStats(hunt, slots);
        renderHeader(hunt, stats);
        renderSlots(slots);
      } catch (error) {
        console.error(error);
        els.huntTitle.textContent = "Erro no overlay";
        els.huntSubtitle.textContent = "Não foi possível carregar os dados";
        setMainState("Erro ao carregar a hunt.");
      }
    }

    startAutoScroll();
    loadOverlay();
    setInterval(loadOverlay, refreshMs);
  </script>
</body>
</html>
