<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>Catarina Tracker Overlay</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Marck+Script&display=swap" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg-top: #503fc8;
      --bg-bottom: #2a1d73;

      --shell-top: #3c2f8d;
      --shell-bottom: #24185d;
      --shell-border: rgba(170, 156, 255, 0.26);

      --card-top: #5a47c0;
      --card-bottom: #35248c;
      --card-border: rgba(188, 176, 255, 0.18);

      --mini-top: #5a47c0;
      --mini-bottom: #35248c;

      --text-main: #ffffff;
      --text-soft: rgba(234, 244, 255, 0.76);

      --yellow: #ffd447;
      --light-blue: #8fd6ff;
      --green: #72efac;

      --super-border: rgba(255, 219, 92, 1);
      --super-glow: rgba(255, 214, 90, 0.70);
      --super-inner: rgba(255, 228, 130, 0.22);
      --super-neon: rgba(255, 228, 122, 0.42);

      --epic-border: rgba(255, 128, 186, 1);
      --epic-glow: rgba(255, 120, 170, 0.70);
      --epic-inner: rgba(255, 170, 210, 0.22);
      --epic-neon: rgba(255, 140, 190, 0.40);

      --shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
      --radius-shell: 28px;
      --script-font: "Marck Script", cursive;
      --number-font: "Nunito", sans-serif;
    }

    html,
    body {
      width: 1080px;
      height: 1920px;
      margin: 0;
      overflow: hidden;
      font-family: var(--number-font);
      color: var(--text-main);
      background:
        radial-gradient(circle at top, rgba(255,255,255,0.08), transparent 24%),
        linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    }

    body {
      padding: 12px 0 12px 14px;
    }

    #app {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: flex-start;
      align-items: flex-start;
    }

    .overlay-shell {
      width: 382px;
      height: 100%;
      border-radius: var(--radius-shell);
      background: linear-gradient(180deg, var(--shell-top), var(--shell-bottom));
      border: 2px solid var(--shell-border);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .overlay-shell::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.08), transparent 14%),
        linear-gradient(90deg, rgba(255,255,255,0.05), transparent 10%, transparent 90%, rgba(0,0,0,0.18));
      opacity: 0.9;
    }

    .top-panel {
      position: relative;
      z-index: 1;
      padding: 10px 10px 8px;
      border-bottom: 1px solid rgba(188, 176, 255, 0.14);
      background: linear-gradient(180deg, rgba(58, 43, 132, 0.96), rgba(34, 23, 91, 0.92));
    }

    .brand-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .brand-left {
      min-width: 0;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .brand-badge {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      flex: 0 0 auto;
      border: 3px solid #34b2ff;
      position: relative;
      box-shadow: 0 0 10px rgba(52, 178, 255, 0.35);
    }

    .brand-badge::before,
    .brand-badge::after {
      content: "";
      position: absolute;
      background: #34b2ff;
      border-radius: 999px;
    }

    .brand-badge::before {
      width: 10px;
      height: 3px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .brand-badge::after {
      width: 3px;
      height: 10px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .brand-text {
      min-width: 0;
    }

    .hunt-title {
      font-size: 33px;
      font-weight: 400;
      line-height: 0.95;
      letter-spacing: 0.01em;
      color: #ffffff;
      font-family: var(--script-font);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 235px;
      text-transform: none;
    }

    .hunt-subtitle {
      margin-top: 1px;
      font-size: 20px;
      font-weight: 400;
      letter-spacing: 0.01em;
      color: var(--text-soft);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: var(--script-font);
      text-transform: none;
      line-height: 0.95;
    }

    .hunt-id {
      padding-top: 4px;
      font-size: 16px;
      font-weight: 800;
      font-family: var(--number-font);
      color: rgba(240, 236, 255, 0.82);
      white-space: nowrap;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      margin-bottom: 7px;
    }

    .stat-card {
      min-height: 50px;
      border-radius: 9px;
      padding: 6px 9px 6px;
      background: linear-gradient(180deg, var(--mini-top), var(--mini-bottom));
      border: 1px solid var(--card-border);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
    }

    .stat-label {
      font-size: 16px;
      font-weight: 400;
      line-height: 1;
      color: rgba(236, 230, 255, 0.88);
      letter-spacing: 0.01em;
      white-space: nowrap;
      font-family: var(--script-font);
      text-transform: none;
    }

    .stat-value {
      margin-top: 4px;
      font-size: 18px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: var(--number-font);
    }

    .stat-value.yellow { color: var(--yellow); }
    .stat-value.blue { color: var(--light-blue); }
    .stat-value.white { color: #ffffff; }

    .types-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 7px;
    }

    .type-pill {
      min-height: 28px;
      border-radius: 7px;
      padding: 0 9px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .type-pill .type-label {
      font-size: 18px;
      font-weight: 400;
      line-height: 1;
      letter-spacing: 0.01em;
      font-family: var(--script-font);
      text-transform: none;
    }

    .type-pill .type-value {
      font-size: 13px;
      font-weight: 900;
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: 0.01em;
      font-family: var(--number-font);
    }

    .type-pill.super {
      background: linear-gradient(180deg, rgba(244, 199, 73, 0.24), rgba(244, 199, 73, 0.12));
      border: 1px solid rgba(255, 214, 90, 0.82);
      color: #ffe388;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.10),
        0 0 16px rgba(255, 214, 90, 0.18);
    }

    .type-pill.epic {
      background: linear-gradient(180deg, rgba(255, 120, 170, 0.22), rgba(255, 120, 170, 0.10));
      border: 1px solid rgba(255, 126, 179, 0.82);
      color: #ffaad0;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.10),
        0 0 16px rgba(255, 120, 170, 0.18);
    }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 0;
    }

    .progress-dot {
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #4bb7ff;
      box-shadow: 0 0 10px rgba(75, 183, 255, 0.55);
    }

    .progress-bar {
      flex: 1;
      height: 7px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #238aff 0%, #5fc4ff 100%);
      transition: width 0.35s ease;
    }

    .progress-text {
      flex: 0 0 auto;
      min-width: 44px;
      text-align: right;
      font-size: 15px;
      font-weight: 900;
      color: #ffffff;
      font-family: var(--number-font);
    }

    .list-panel {
      position: relative;
      z-index: 1;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(52, 35, 123, 0.18), rgba(28, 18, 83, 0.28));
    }

    .list-header {
      padding: 10px 12px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid rgba(188, 176, 255, 0.10);
    }

    .list-title {
      font-size: 21px;
      font-weight: 400;
      color: rgba(248, 245, 255, 0.92);
      letter-spacing: 0.01em;
      font-family: var(--script-font);
      text-transform: none;
      line-height: 1;
    }

    .list-counter {
      font-size: 18px;
      font-weight: 400;
      color: rgba(233, 226, 255, 0.82);
      font-family: var(--script-font);
      text-transform: none;
      line-height: 1;
    }

    .slots-scroll {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      position: relative;
    }

    .slots-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px 8px 12px;
      will-change: transform;
    }

    .slot-card {
      border-radius: 10px;
      overflow: hidden;
      background: linear-gradient(180deg, #5845bc, #322387);
      border: 1px solid rgba(188, 176, 255, 0.14);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
      position: relative;
    }

    .slot-card.super {
      border: 2px solid var(--super-border);
      box-shadow:
        inset 0 0 0 1px var(--super-inner),
        inset 0 1px 0 rgba(255,255,255,0.07),
        0 0 10px 1px var(--super-glow),
        0 0 22px 4px var(--super-neon);
    }

    .slot-card.super::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: 10px;
      box-shadow:
        inset 0 0 26px rgba(255, 219, 92, 0.22),
        inset 0 0 2px rgba(255,255,255,0.08);
    }

    .slot-card.epic {
      border: 2px solid var(--epic-border);
      box-shadow:
        inset 0 0 0 1px var(--epic-inner),
        inset 0 1px 0 rgba(255,255,255,0.07),
        0 0 10px 1px var(--epic-glow),
        0 0 22px 4px var(--epic-neon);
    }

    .slot-card.epic::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: 10px;
      box-shadow:
        inset 0 0 26px rgba(255, 128, 186, 0.22),
        inset 0 0 2px rgba(255,255,255,0.08);
    }

    .slot-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 8px 5px;
      background: linear-gradient(180deg, rgba(29, 18, 72, 0.26), rgba(0, 0, 0, 0.08));
    }

    .slot-top-left {
      min-width: 0;
    }

    .slot-name {
      font-size: 22px;
      font-weight: 400;
      line-height: 0.95;
      color: #ffffff;
      letter-spacing: 0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 245px;
      font-family: var(--script-font);
      text-transform: none;
    }

    .slot-bet {
      margin-top: 2px;
      font-size: 10px;
      font-weight: 800;
      color: rgba(238, 232, 255, 0.82);
      letter-spacing: 0.01em;
      font-family: var(--number-font);
    }

    .slot-index {
      flex: 0 0 auto;
      font-size: 12px;
      font-weight: 900;
      color: rgba(238, 232, 255, 0.72);
      font-family: var(--number-font);
    }

    .slot-image-wrap {
      width: 100%;
      aspect-ratio: 1 / 0.82;
      background: #24185f;
      position: relative;
      overflow: hidden;
      border-top: 1px solid rgba(255,255,255,0.04);
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }

    .slot-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      transform: scale(1.02);
    }

    .slot-image-wrap.fallback::before {
      content: "🎰";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      opacity: 0.9;
    }

    .slot-bottom {
      padding: 7px 8px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    .slot-status {
      text-align: right;
      min-width: 110px;
    }

    .slot-status.opened {
      color: var(--green);
    }

    .slot-status-label {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      opacity: 0.86;
      font-family: var(--number-font);
    }

    .slot-status-value {
      margin-top: 2px;
      font-size: 18px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.02em;
      white-space: nowrap;
      font-family: var(--number-font);
    }

    .footer-stats {
      padding: 8px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      border-top: 1px solid rgba(188, 176, 255, 0.10);
      background: linear-gradient(180deg, rgba(53, 37, 124, 0.94), rgba(29, 19, 83, 0.98));
    }

    .footer-box {
      min-height: 52px;
      border-radius: 10px;
      padding: 7px 8px;
      background: linear-gradient(180deg, #5a47c0, #35248c);
      border: 1px solid rgba(188, 176, 255, 0.16);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .footer-box.total {
      grid-column: span 2;
      min-height: 56px;
      align-items: center;
      text-align: center;
    }

    .footer-label {
      font-size: 11px;
      font-weight: 700;
      color: rgba(236, 230, 255, 0.74);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      line-height: 1;
      font-family: var(--number-font);
    }

    .footer-value {
      margin-top: 5px;
      font-size: 22px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.02em;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: var(--number-font);
    }

    .footer-value.green {
      color: var(--green);
    }

    .footer-value.blue {
      color: var(--light-blue);
    }

    .loading-state,
    .empty-state {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      color: rgba(236, 230, 255, 0.72);
      font-size: 20px;
      font-weight: 700;
      line-height: 1.3;
      font-family: var(--number-font);
    }

    .hide {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="overlay-shell">
      <section class="top-panel">
        <div class="brand-row">
          <div class="brand-left">
            <div class="brand-badge"></div>
            <div class="brand-text">
              <div id="huntTitle" class="hunt-title">Bonus Hunt</div>
              <div id="huntSubtitle" class="hunt-subtitle">Sem hunt ativa</div>
            </div>
          </div>
          <div id="huntId" class="hunt-id">#000</div>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">Start</div>
            <div id="statStart" class="stat-value yellow">0€</div>
          </div>

          <div class="stat-card">
            <div class="stat-label">Breakeven</div>
            <div id="statBreakeven" class="stat-value blue">0%</div>
          </div>

          <div class="stat-card">
            <div class="stat-label">Bonuses</div>
            <div id="statBonuses" class="stat-value white">0</div>
          </div>

          <div class="stat-card">
            <div class="stat-label">Opening</div>
            <div id="statOpening" class="stat-value blue">0/0</div>
          </div>
        </div>

        <div class="types-row">
          <div class="type-pill super">
            <span class="type-label">Super</span>
            <span id="statSuper" class="type-value">0</span>
          </div>
          <div class="type-pill epic">
            <span class="type-label">Epic</span>
            <span id="statEpic" class="type-value">0</span>
          </div>
        </div>

        <div class="progress-row">
          <div class="progress-dot"></div>
          <div class="progress-bar">
            <div id="progressFill" class="progress-fill"></div>
          </div>
          <div id="progressText" class="progress-text">0/0</div>
        </div>
      </section>

      <section class="list-panel">
        <div class="list-header">
          <div class="list-title">Hunt</div>
          <div id="listCounter" class="list-counter">0 slots</div>
        </div>

        <div id="slotsScroll" class="slots-scroll">
          <div id="loadingState" class="loading-state">A carregar overlay...</div>
          <div id="emptyState" class="empty-state hide">Sem slots para mostrar.</div>
          <div id="slotsList" class="slots-list hide"></div>
        </div>
      </section>

      <section class="footer-stats">
        <div class="footer-box">
          <div class="footer-label">Average</div>
          <div id="footerAverage" class="footer-value">0.00x</div>
        </div>

        <div class="footer-box">
          <div class="footer-label">Breakeven</div>
          <div id="footerBreakeven" class="footer-value blue">0%</div>
        </div>

        <div class="footer-box total">
          <div class="footer-label">Total Pay</div>
          <div id="footerTotalPay" class="footer-value green">0€</div>
        </div>
      </section>
    </div>
  </div>

  <script>
    const SUPABASE_URL =
      window.CT_SUPABASE_URL ||
      window.SUPABASE_URL ||
      window.ENV?.SUPABASE_URL ||
      localStorage.getItem("SUPABASE_URL") ||
      "https://cwengomkuhqvrdcpkgwp.supabase.co";

    const SUPABASE_ANON_KEY =
      window.CT_SUPABASE_ANON_KEY ||
      window.SUPABASE_ANON_KEY ||
      window.ENV?.SUPABASE_ANON_KEY ||
      localStorage.getItem("SUPABASE_ANON_KEY") ||
      "sb_publishable_Hi1T9WK_snEgqPep5JJnRQ__HSJXQUs";

    const refreshMs = 3000;

    const listEl = document.getElementById("slotsList");
    const loadingEl = document.getElementById("loadingState");
    const emptyEl = document.getElementById("emptyState");
    const scrollEl = document.getElementById("slotsScroll");

    const els = {
      huntTitle: document.getElementById("huntTitle"),
      huntSubtitle: document.getElementById("huntSubtitle"),
      huntId: document.getElementById("huntId"),
      progressFill: document.getElementById("progressFill"),
      progressText: document.getElementById("progressText"),
      listCounter: document.getElementById("listCounter"),
      statStart: document.getElementById("statStart"),
      statBreakeven: document.getElementById("statBreakeven"),
      statBonuses: document.getElementById("statBonuses"),
      statOpening: document.getElementById("statOpening"),
      statSuper: document.getElementById("statSuper"),
      statEpic: document.getElementById("statEpic"),
      footerAverage: document.getElementById("footerAverage"),
      footerBreakeven: document.getElementById("footerBreakeven"),
      footerTotalPay: document.getElementById("footerTotalPay")
    };

    let autoScrollY = 0;
    let autoScrollDirection = 1;
    let lastRenderedSignature = "";

    function headers(includeJson = false) {
      const h = {
        apikey: SUPABASE_ANON_KEY,
        Authorization: "Bearer " + SUPABASE_ANON_KEY
      };

      if (includeJson) {
        h["Content-Type"] = "application/json";
      }

      return h;
    }

    async function fetchJson(url, options = {}) {
      const res = await fetch(url, options);
      const text = await res.text();
      let data = null;

      try {
        data = text ? JSON.parse(text) : null;
      } catch {
        data = text || null;
      }

      return { res, data };
    }

    function euro(value) {
      const n = Number(value || 0);
      return new Intl.NumberFormat("pt-PT", {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
      }).format(n) + "€";
    }

    function pct(value) {
      const n = Number(value || 0);
      return new Intl.NumberFormat("pt-PT", {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
      }).format(n) + "%";
    }

    function num(value) {
      return new Intl.NumberFormat("pt-PT").format(Number(value || 0));
    }

    function multi(value) {
      const n = Number(value || 0);
      return new Intl.NumberFormat("pt-PT", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }).format(n) + "x";
    }

    function pick(obj, keys, fallback = null) {
      if (!obj) return fallback;
      for (const key of keys) {
        if (obj[key] !== undefined && obj[key] !== null && obj[key] !== "") {
          return obj[key];
        }
      }
      return fallback;
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function isOpened(item) {
      const raw = String(
        pick(item, ["status", "state", "opening_status", "result_status"], "")
      ).toLowerCase();

      if (raw) {
        return ["opened", "open", "done", "finished", "paid", "completed"].includes(raw);
      }

      const payout = Number(pick(item, ["payout", "result", "win_amount", "paid_amount"], 0) || 0);
      return payout > 0;
    }

    function normalizeBonusType(item) {
      const raw = String(
        pick(item, ["bonus_type", "type", "rarity", "tier", "tipo_slot"], "normal")
      ).toLowerCase();

      if (raw.includes("epic")) return "epic";
      if (raw.includes("super")) return "super";
      if (raw.includes("extreme")) return "epic";
      return "normal";
    }

    function normalizeSlot(item, index = 0) {
      return {
        id: pick(item, ["id", "slot_id", "bonus_id"], "slot-" + index),
        name: pick(item, ["slot_name", "name", "nome", "title", "slot"], "Slot"),
        image: pick(item, ["image_url", "imagem_url", "slot_image", "image", "thumb", "thumbnail_url"], ""),
        type: normalizeBonusType(item),
        payout: Number(pick(item, ["payout", "result", "paid_amount", "win_amount"], 0) || 0),
        bet: Number(pick(item, ["bet", "bet_size", "base_bet", "stake"], 0) || 0),
        provider: pick(item, ["provider"], ""),
        opened: isOpened(item),
        order: Number(pick(item, ["sort_order", "position", "display_order", "order_index", "id"], index)) || index
      };
    }

    async function getActiveHunt() {
      const { res, data } = await fetchJson(
        `${SUPABASE_URL}/rest/v1/hunts?select=*&order=id.desc`,
        { headers: headers(false) }
      );

      if (!res.ok || !Array.isArray(data) || !data.length) {
        return null;
      }

      return data.find(h => h.is_active === true || String(h.status || "").toLowerCase() === "active") || null;
    }

    async function getHuntSlots(huntId) {
      const { res, data } = await fetchJson(
        `${SUPABASE_URL}/rest/v1/hunt_slots?hunt_id=eq.${huntId}&select=*&order=id.asc`,
        { headers: headers(false) }
      );

      if (!res.ok || !Array.isArray(data)) {
        return [];
      }

      return data;
    }

    function computeStats(hunt, slots) {
      const start = Number(
        pick(hunt, ["start_balance", "start", "starting_balance", "hunt_start"], 0) || 0
      );

      const total = slots.length;
      const openedSlots = slots.filter(s => s.opened);
      const opened = openedSlots.length;
      const totalPaid = openedSlots.reduce((sum, s) => sum + Number(s.payout || 0), 0);
      const breakevenPct = start > 0 ? (totalPaid / start) * 100 : 0;
      const averageX = start > 0 && opened > 0 ? totalPaid / start : 0;
      const superCount = slots.filter(s => s.type === "super").length;
      const epicCount = slots.filter(s => s.type === "epic").length;

      return {
        start,
        total,
        opened,
        totalPaid,
        breakevenPct,
        averageX,
        superCount,
        epicCount
      };
    }

    function setMainState(message) {
      loadingEl.textContent = message;
      loadingEl.classList.remove("hide");
      emptyEl.classList.add("hide");
      listEl.classList.add("hide");
      listEl.innerHTML = "";
    }

    function setEmptyState(message) {
      loadingEl.classList.add("hide");
      emptyEl.textContent = message;
      emptyEl.classList.remove("hide");
      listEl.classList.add("hide");
      listEl.innerHTML = "";
    }

    function renderNoActiveHunt() {
      els.huntTitle.textContent = "Bonus Hunt";
      els.huntSubtitle.textContent = "Sem hunt ativa";
      els.huntId.textContent = "#000";

      els.progressFill.style.width = "0%";
      els.progressText.textContent = "0/0";

      els.statStart.textContent = "0€";
      els.statBreakeven.textContent = "0%";
      els.statBonuses.textContent = "0";
      els.statOpening.textContent = "0/0";
      els.statSuper.textContent = "0";
      els.statEpic.textContent = "0";

      els.footerAverage.textContent = "0.00x";
      els.footerBreakeven.textContent = "0%";
      els.footerTotalPay.textContent = "0€";

      els.listCounter.textContent = "0 slots";
      setEmptyState("Sem hunt ativa.");
    }

    function renderHeader(hunt, stats) {
      const huntName = pick(hunt, ["nome", "name", "title"], "Bonus Hunt");
      const huntId = pick(hunt, ["id", "display_id", "hunt_number", "number"], "000");

      els.huntTitle.textContent = "Bonus Hunt";
      els.huntSubtitle.textContent = huntName;
      els.huntId.textContent = "#" + String(huntId);

      const progress = stats.total > 0 ? (stats.opened / stats.total) * 100 : 0;
      els.progressFill.style.width = Math.max(0, Math.min(progress, 100)) + "%";
      els.progressText.textContent = `${num(stats.opened)}/${num(stats.total)}`;

      els.statStart.textContent = euro(stats.start);
      els.statBreakeven.textContent = pct(stats.breakevenPct);
      els.statBonuses.textContent = num(stats.total);
      els.statOpening.textContent = `${num(stats.opened)}/${num(stats.total)}`;
      els.statSuper.textContent = num(stats.superCount);
      els.statEpic.textContent = num(stats.epicCount);

      els.footerAverage.textContent = multi(stats.averageX);
      els.footerBreakeven.textContent = pct(stats.breakevenPct);
      els.footerTotalPay.textContent = euro(stats.totalPaid);

      els.listCounter.textContent = `${num(stats.total)} slots`;
    }

    function slotCardTemplate(slot, index) {
      const imageMarkup = slot.image
        ? `<img class="slot-image" src="${slot.image}" alt="${escapeHtml(slot.name)}" onerror="this.parentNode.classList.add('fallback'); this.remove();" />`
        : "";

      const statusMarkup = slot.opened
        ? `
          <div class="slot-bottom">
            <div class="slot-status opened">
              <div class="slot-status-label">Payout</div>
              <div class="slot-status-value">${euro(slot.payout)}</div>
            </div>
          </div>
        `
        : ``;

      return `
        <div class="slot-card ${slot.type}">
          <div class="slot-top">
            <div class="slot-top-left">
              <div class="slot-name">${escapeHtml(slot.name)}</div>
              <div class="slot-bet">${slot.bet > 0 ? euro(slot.bet) : "&nbsp;"}</div>
            </div>
            <div class="slot-index">#${index + 1}</div>
          </div>

          <div class="slot-image-wrap ${slot.image ? "" : "fallback"}">
            ${imageMarkup}
          </div>

          ${statusMarkup}
        </div>
      `;
    }

    function renderSlots(slots) {
      if (!slots.length) {
        setEmptyState("Esta hunt ainda não tem slots.");
        return;
      }

      const signature = JSON.stringify(
        slots.map(s => [s.id, s.name, s.image, s.type, s.payout, s.bet, s.opened, s.order])
      );

      if (signature !== lastRenderedSignature) {
        lastRenderedSignature = signature;
        listEl.innerHTML = slots.map((slot, index) => slotCardTemplate(slot, index)).join("");
      }

      loadingEl.classList.add("hide");
      emptyEl.classList.add("hide");
      listEl.classList.remove("hide");
    }

    function startAutoScroll() {
      const speed = 0.38;

      function step() {
        const maxScroll = Math.max(0, listEl.scrollHeight - scrollEl.clientHeight);

        if (maxScroll <= 0 || listEl.classList.contains("hide")) {
          listEl.style.transform = "translateY(0px)";
          autoScrollY = 0;
          requestAnimationFrame(step);
          return;
        }

        autoScrollY += speed * autoScrollDirection;

        if (autoScrollY >= maxScroll) {
          autoScrollY = maxScroll;
          autoScrollDirection = -1;
        } else if (autoScrollY <= 0) {
          autoScrollY = 0;
          autoScrollDirection = 1;
        }

        listEl.style.transform = `translateY(${-autoScrollY}px)`;
        requestAnimationFrame(step);
      }

      requestAnimationFrame(step);
    }

    async function loadOverlay() {
      try {
        const hunt = await getActiveHunt();

        if (!hunt) {
          renderNoActiveHunt();
          return;
        }

        const huntId = pick(hunt, ["id"]);
        const rawBonuses = await getHuntSlots(huntId);
        const slots = rawBonuses
          .map((item, index) => normalizeSlot(item, index))
          .sort((a, b) => a.order - b.order);

        const stats = computeStats(hunt, slots);

        renderHeader(hunt, stats);
        renderSlots(slots);
      } catch (error) {
        console.error(error);
        els.huntTitle.textContent = "Erro";
        els.huntSubtitle.textContent = "Não foi possível carregar";
        els.huntId.textContent = "#ERR";
        setMainState("Erro ao carregar a hunt.");
      }
    }

    startAutoScroll();
    loadOverlay();
    setInterval(loadOverlay, refreshMs);
  </script>
</body>
</html>
