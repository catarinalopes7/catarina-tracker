<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920">
<title>CT Overlay - Catarina Tracker</title>
<style>
body{
  width:1080px; height:1920px; margin:0;
  background:linear-gradient(180deg,#4F3EC7,#362A7A);
  color:#fff; font-family:'Poppins',sans-serif;
  text-align:center; overflow:hidden;
}
#title{
  font-size:40px;font-weight:700;
  color:#FFD54A;margin-top:25px;
}
#stats{
  font-size:22px;line-height:1.5em;
  margin-top:10px;color:#EEE;
}
#bestworst{
  margin-top:25px;
}
.slot-card{
  background:rgba(0,0,0,0.35);
  border-radius:12px;margin:8px auto;
  padding:15px;width:85%;font-size:22px;line-height:1.4em;
  min-height:120px;display:flex;align-items:center;justify-content:center;
  transition:all 0.8s ease;
}
.slot-card.best{border-left:6px solid #36d27d;}
.slot-card.worst{border-left:6px solid #ff5c5c;}
.slot-img{
  width:80px;height:80px;border-radius:8px;margin-right:15px;
  background:#444;display:flex;align-items:center;justify-content:center;
  font-size:12px;color:#aaa;
}
#bonus-wrap{
  height:1350px;overflow-y:auto;
  margin-top:20px;padding:0 40px;
}
.card{
  background:rgba(0,0,0,0.25);
  border-radius:12px;margin:10px 0;padding:15px;
  font-size:20px;text-align:left;
}
.super{color:#FFD54A;}
.épico{color:#FF5C5C;}
.normal{color:#FFF;}
#bonus-wrap::-webkit-scrollbar{width:6px;}
#bonus-wrap::-webkit-scrollbar-thumb{background:#FFD54A;border-radius:4px;}
</style>
</head>
<body>
  <div id="title">CT 🎯</div>
  <div id="stats">Carregando estatísticas...</div>

  <div id="bestworst">
    <div id="slideshow" class="slot-card"></div>
  </div>
  <div id="bonus-wrap"></div>

  <script src="../admin/conexao.js"></script>
  <script>
  let melhorSlot=null, piorSlot=null, mostrandoMelhor=true;

  async function carregarOverlay(){
    // 🔹 Buscar hunts (pega a mais recente)
    const huntsResp = await fetch(`${SUPABASE_URL}/rest/v1/hunts?select=*`,{headers});
    const hunts = await huntsResp.json();
    const atual = hunts[hunts.length-1];
    if(!atual){
      document.getElementById("stats").innerHTML="Nenhuma caçada criada ainda.";
      return;
    }

    // 🔹 Estatísticas gerais
    const start = atual.start_balance||0;
    const pago  = atual.total_pago||0;
    const lucro = atual.profit_loss||0;
    const corLucro = lucro>=0 ? "lawngreen" : "#FF5C5C";
    const breakeven = start>0 ? (start / (pago||start) * 100) : 0;
    const average = start>0 ? (pago/start*100) : 0;

    document.getElementById("stats").innerHTML =
      `💰 Saldo Inicial: ${start.toFixed(2)} € |
       💵 Total Pago: ${pago.toFixed(2)} € |
       <span style="color:${corLucro};">Lucro/Prejuízo: ${lucro.toFixed(2)} €</span><br>
       🏁 Breakeven X: ${breakeven.toFixed(2)}× |
       📈 Average X: ${average.toFixed(2)}×`;

    // 🔹 Buscar todos os bónus
    const bonusResp = await fetch(`${SUPABASE_URL}/rest/v1/bonus?select=*`,{headers});
    const bonusAll = await bonusResp.json();
    const bonus = bonusAll.filter(b=>b.hunt_id===atual.id);

    // --- Calcular melhor e pior slot ---
    const bonusComPayout = bonus.filter(b=>b.payout && b.aposta);
    if(bonusComPayout.length){
      melhorSlot = bonusComPayout.reduce((a,b)=>{
        const multA=a.payout/a.aposta, multB=b.payout/b.aposta;
        return multB>multA?b:a;
      });
      piorSlot = bonusComPayout.reduce((a,b)=>{
        const multA=a.payout/a.aposta, multB=b.payout/b.aposta;
        return multB<multA?b:a;
      });
    }

    // 🔹 Listagem completa de bónus
    const lista = document.getElementById("bonus-wrap");
    lista.innerHTML="";
    for(const b of bonus.slice().reverse()){
      const div=document.createElement("div");
      div.className="card";
      div.innerHTML=
        `<b>${b.nome}</b> — Aposta ${b.aposta?.toFixed(2)||0} €
         <span class="${(b.tipo||'').toLowerCase()}">${b.tipo||""}</span>
         | Payout: ${b.payout?.toFixed(2)||0} €`;
      lista.appendChild(div);
    }
  }

  // 🔄 Alternar entre melhor e pior slot
  function atualizarSlideshow(){
    const slideDiv = document.getElementById("slideshow");
    if(!melhorSlot && !piorSlot){
      slideDiv.innerHTML = "<span style='color:#888;'>Sem slots com payout ainda</span>";
      return;
    }

    const slot = mostrandoMelhor ? melhorSlot : piorSlot;
    const emoji = mostrandoMelhor ? "🏆" : "💀";
    const label = mostrandoMelhor ? "Melhor" : "Pior";
    const classe = mostrandoMelhor ? "best" : "worst";
    
    if(slot){
      const mult = (slot.payout/slot.aposta).toFixed(2);
      slideDiv.className = `slot-card ${classe}`;
      slideDiv.innerHTML = `
        <div class="slot-img">IMG</div>
        <div>
          ${emoji} ${label} Slot<br>
          <span class="${(slot.tipo||'').toLowerCase()}">${slot.tipo||""}</span><br>
          Bet: ${slot.aposta.toFixed(2)}€ | Mult: ${mult}×
        </div>`;
    }
    
    mostrandoMelhor = !mostrandoMelhor;
  }

  // Atualiza dados a cada 5 segundos
  carregarOverlay();
  setInterval(carregarOverlay,5000);

  // Alterna melhor/pior a cada 4 segundos
  setInterval(atualizarSlideshow,4000);
  atualizarSlideshow();
  </script>
</body>
</html>
