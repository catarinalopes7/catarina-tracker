<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>Catarina Tracker Overlay</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg1: #1c1533;
      --bg2: #2a1f4f;
      --panel: rgba(255,255,255,0.08);
      --panel-strong: rgba(255,255,255,0.12);
      --border: rgba(255,255,255,0.16);
      --text: #ffffff;
      --muted: rgba(255,255,255,0.72);
      --gold: #ffd54a;
      --green: #44d17a;
      --red: #ff5c7a;
      --blue: #69b7ff;
      --purple: #b58cff;
      --shadow: 0 18px 50px rgba(0,0,0,0.35);
    }

    html, body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      font-family: 'Poppins', Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(122, 78, 255, 0.32), transparent 28%),
        linear-gradient(180deg, #221942 0%, #171126 100%);
    }

    body {
      padding: 34px 34px 28px;
    }

    .overlay {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .topbar {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .hunt-title {
      width: 100%;
      min-height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 28px;
      text-align: center;
      border-radius: 28px;
      background: linear-gradient(135deg, rgba(255,213,74,0.18), rgba(255,255,255,0.08));
      border: 1px solid rgba(255,213,74,0.22);
      box-shadow: var(--shadow);
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 0.4px;
      color: var(--gold);
      text-transform: uppercase;
    }

    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .stat-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 22px 24px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }

    .stat-label {
      font-size: 19px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .stat-value {
      font-size: 38px;
      font-weight: 800;
      line-height: 1;
    }

    .progress-wrap {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .progress-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .progress-head .left {
      font-size: 19px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .progress-head .right {
      font-size: 34px;
      font-weight: 800;
      color: var(--text);
      line-height: 1;
    }

    .progress-bar {
      width: 100%;
      height: 16px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #ffd54a, #ff9f43);
      transition: width 0.35s ease;
    }

    .cards-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
    }

    .mini-card {
      min-height: 128px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 18px 18px 16px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .mini-label {
      font-size: 16px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .mini-value {
      font-size: 32px;
      font-weight: 800;
      line-height: 1.05;
      word-break: break-word;
    }

    .value-green { color: var(--green); }
    .value-red { color: var(--red); }
    .value-gold { color: var(--gold); }
    .value-blue { color: var(--blue); }
    .value-purple { color: var(--purple); }

    .list-panel {
      flex: 1;
      min-height: 0;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 20px;
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .list-inner {
      display: flex;
      flex-direction: column;
      gap: 14px;
      will-change: transform;
    }

    .bonus-card {
      width: 100%;
      min-height: 132px;
      border-radius: 24px;
      padding: 18px 20px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.10);
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr;
      gap: 12px;
      align-items: center;
      transition: transform 0.22s ease, border-color 0.22s ease, background 0.22s ease;
    }

    .bonus-card.active {
      background: linear-gradient(135deg, rgba(255,213,74,0.18), rgba(255,255,255,0.10));
      border: 1px solid rgba(255,213,74,0.42);
      transform: scale(1.012);
      box-shadow: 0 0 0 2px rgba(255,213,74,0.14), 0 18px 34px rgba(0,0,0,0.24);
    }

    .bonus-main {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
    }

    .bonus-name {
      font-size: 28px;
      font-weight: 800;
      line-height: 1.05;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bonus-meta {
      font-size: 18px;
      font-weight: 600;
      color: var(--muted);
    }

    .bonus-side {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      gap: 6px;
      text-align: right;
    }

    .bonus-side-label {
      font-size: 15px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .bonus-side-value {
      font-size: 28px;
      font-weight: 800;
      line-height: 1;
    }

    .empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 26px;
      font-weight: 700;
      color: var(--muted);
      padding: 30px;
    }

    .footer-note {
      text-align: center;
      font-size: 14px;
      color: rgba(255,255,255,0.38);
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="topbar">
      <div id="huntTitle" class="hunt-title">A carregar hunt...</div>

      <div class="stats-row">
        <div class="stat-box">
          <div class="stat-label">Total Bónus</div>
          <div id="totalBonus" class="stat-value">0</div>
        </div>

        <div class="stat-box">
          <div class="progress-wrap">
            <div class="progress-head">
              <div class="left">Open</div>
              <div id="openCount" class="right">0/0</div>
            </div>
            <div class="progress-bar">
              <div id="progressFill" class="progress-fill"></div>
            </div>
          </div>
        </div>
      </div>

      <div id="cardsRow" class="cards-row">
        <div class="mini-card">
          <div class="mini-label">AVG X</div>
          <div id="avgX" class="mini-value value-gold">0.00x</div>
        </div>

        <div class="mini-card">
          <div class="mini-label">BE Inicial</div>
          <div id="beInicial" class="mini-value value-blue">0%</div>
        </div>

        <div id="beAberturaCard" class="mini-card" style="display:none;">
          <div class="mini-label">BE Abertura</div>
          <div id="beAbertura" class="mini-value value-purple">0%</div>
        </div>

        <div class="mini-card">
          <div class="mini-label">Profit / Loss</div>
          <div id="profitLoss" class="mini-value">0.00€</div>
        </div>

        <div class="mini-card">
          <div class="mini-label">Total Pago</div>
          <div id="totalPago" class="mini-value value-green">0.00€</div>
        </div>
      </div>
    </div>

    <div class="list-panel">
      <div id="listInner" class="list-inner"></div>
      <div id="emptyState" class="empty" style="display:none;">Sem bónus para mostrar.</div>
    </div>

    <div class="footer-note">Catarina Tracker Overlay</div>
  </div>

  <script>
    const SUPABASE_URL = "COLOCA_AQUI_O_TEU_SUPABASE_URL";
    const SUPABASE_KEY = "COLOCA_AQUI_O_TEU_SUPABASE_ANON_KEY";

    const HUNTS_TABLE = "hunts";
    const BONUSES_TABLE = "hunt_bonuses";

    const REFRESH_MS = 2500;
    const AUTOSCROLL_SPEED = 0.45;

    let currentActiveHuntId = null;
    let bonusesCache = [];
    let scrollPos = 0;
    let animationFrame = null;

    function headers() {
      return {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`,
        "Content-Type": "application/json",
        Prefer: "return=representation"
      };
    }

    function euro(value) {
      const num = Number(value || 0);
      return `${num.toFixed(2)}€`;
    }

    function percent(value) {
      const num = Number(value || 0);
      return `${num.toFixed(0)}%`;
    }

    function xValue(value) {
      const num = Number(value || 0);
      return `${num.toFixed(2)}x`;
    }

    function safeNumber(value) {
      const n = Number(value);
      return Number.isFinite(n) ? n : 0;
    }

    async function fetchActiveHunt() {
      const url =
        `${SUPABASE_URL}/rest/v1/${HUNTS_TABLE}` +
        `?select=*` +
        `&is_active=eq.true` +
        `&order=created_at.desc` +
        `&limit=1`;

      const res = await fetch(url, { headers: headers() });
      if (!res.ok) throw new Error("Erro ao buscar hunt ativa");
      const data = await res.json();
      return data[0] || null;
    }

    async function fetchBonuses(huntId) {
      const url =
        `${SUPABASE_URL}/rest/v1/${BONUSES_TABLE}` +
        `?select=*` +
        `&hunt_id=eq.${huntId}` +
        `&order=created_at.asc`;

      const res = await fetch(url, { headers: headers() });
      if (!res.ok) throw new Error("Erro ao buscar bónus");
      return await res.json();
    }

    function getBonusStatus(bonus) {
      const raw = String(bonus.status || "").toLowerCase();

      if (raw === "opened" || raw === "open" || raw === "done" || raw === "completed") {
        return "opened";
      }

      if (raw === "active" || raw === "opening" || raw === "current") {
        return "active";
      }

      return "pending";
    }

    function getActiveBonus(bonuses) {
      return bonuses.find(b => getBonusStatus(b) === "active") || null;
    }

    function countOpened(bonuses) {
      return bonuses.filter(b => {
        const status = getBonusStatus(b);
        return status === "opened" || status === "active";
      }).length;
    }

    function getTotalBonusValue(bonuses) {
      return bonuses.length;
    }

    function getTotalCost(bonuses) {
      return bonuses.reduce((sum, b) => sum + safeNumber(b.buy_amount ?? b.cost ?? b.price ?? 0), 0);
    }

    function getOpenedCost(bonuses) {
      return bonuses.reduce((sum, b) => {
        const status = getBonusStatus(b);
        if (status === "opened" || status === "active") {
          return sum + safeNumber(b.buy_amount ?? b.cost ?? b.price ?? 0);
        }
        return sum;
      }, 0);
    }

    function getTotalPaid(bonuses) {
      return bonuses.reduce((sum, b) => sum + safeNumber(b.payout ?? b.win_amount ?? 0), 0);
    }

    function getAvgX(bonuses) {
      const opened = bonuses.filter(b => {
        const status = getBonusStatus(b);
        return status === "opened" || status === "active";
      });

      if (!opened.length) return 0;

      const totalX = opened.reduce((sum, b) => {
        const bet = safeNumber(b.bet);
        const payout = safeNumber(b.payout ?? b.win_amount ?? 0);
        if (bet <= 0) return sum;
        return sum + (payout / bet);
      }, 0);

      return totalX / opened.length;
    }

    function getBeInicial(bonuses) {
      const totalCost = getTotalCost(bonuses);
      if (totalCost <= 0) return 0;

      const totalPaid = getTotalPaid(bonuses);
      return (totalPaid / totalCost) * 100;
    }

    function getBeAbertura(bonuses) {
      const openedCost = getOpenedCost(bonuses);
      if (openedCost <= 0) return 0;

      const totalPaid = getTotalPaid(bonuses);
      return (totalPaid / openedCost) * 100;
    }

    function getProfitLoss(bonuses) {
      return getTotalPaid(bonuses) - getTotalCost(bonuses);
    }

    function updateTop(hunt, bonuses) {
      document.getElementById("huntTitle").textContent =
        hunt?.name || hunt?.title || "Sem hunt ativa";

      const totalBonus = getTotalBonusValue(bonuses);
      const openedCount = countOpened(bonuses);

      document.getElementById("totalBonus").textContent = totalBonus;
      document.getElementById("openCount").textContent = `${openedCount}/${totalBonus}`;

      const pct = totalBonus > 0 ? (openedCount / totalBonus) * 100 : 0;
      document.getElementById("progressFill").style.width = `${pct}%`;
    }

    function updateCards(bonuses) {
      const avg = getAvgX(bonuses);
      const beInicial = getBeInicial(bonuses);
      const beAbertura = getBeAbertura(bonuses);
      const profitLoss = getProfitLoss(bonuses);
      const totalPago = getTotalPaid(bonuses);
      const activeBonus = getActiveBonus(bonuses);

      document.getElementById("avgX").textContent = xValue(avg);
      document.getElementById("beInicial").textContent = percent(beInicial);
      document.getElementById("totalPago").textContent = euro(totalPago);

      const profitEl = document.getElementById("profitLoss");
      profitEl.textContent = euro(profitLoss);
      profitEl.classList.remove("value-green", "value-red", "value-gold");
      profitEl.classList.add(profitLoss >= 0 ? "value-green" : "value-red");

      const beAberturaCard = document.getElementById("beAberturaCard");
      const beAberturaEl = document.getElementById("beAbertura");

      if (activeBonus) {
        beAberturaCard.style.display = "flex";
        beAberturaEl.textContent = percent(beAbertura);
      } else {
        beAberturaCard.style.display = "none";
      }
    }

    function renderBonuses(bonuses) {
      const listInner = document.getElementById("listInner");
      const emptyState = document.getElementById("emptyState");

      if (!bonuses.length) {
        listInner.innerHTML = "";
        emptyState.style.display = "flex";
        return;
      }

      emptyState.style.display = "none";

      const activeBonus = getActiveBonus(bonuses);

      listInner.innerHTML = bonuses.map((bonus, index) => {
        const isActive = activeBonus && (
          String(activeBonus.id) === String(bonus.id)
        );

        const bet = safeNumber(bonus.bet);
        const payout = safeNumber(bonus.payout ?? bonus.win_amount ?? 0);

        const title =
          bonus.slot_name ||
          bonus.game_name ||
          bonus.name ||
          `Bónus ${index + 1}`;

        return `
          <div class="bonus-card ${isActive ? "active" : ""}">
            <div class="bonus-main">
              <div class="bonus-name">${escapeHtml(title)}</div>
              <div class="bonus-meta">Bet: ${euro(bet)}</div>
            </div>

            <div class="bonus-side">
              <div class="bonus-side-label">Estado</div>
              <div class="bonus-side-value">${isActive ? "AO VIVO" : "NA LISTA"}</div>
            </div>

            <div class="bonus-side">
              <div class="bonus-side-label">${isActive ? "Payout" : ""}</div>
              <div class="bonus-side-value ${payout >= 0 ? "value-green" : "value-red"}">
                ${isActive ? euro(payout) : ""}
              </div>
            </div>
          </div>
        `;
      }).join("");

      restartAutoScroll();
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function restartAutoScroll() {
      const panel = document.querySelector(".list-panel");
      const listInner = document.getElementById("listInner");

      scrollPos = 0;

      if (animationFrame) {
        cancelAnimationFrame(animationFrame);
        animationFrame = null;
      }

      function step() {
        const maxScroll = Math.max(0, listInner.scrollHeight - panel.clientHeight + 40);

        if (maxScroll > 0) {
          scrollPos += AUTOSCROLL_SPEED;
          if (scrollPos >= maxScroll) {
            scrollPos = 0;
          }
          listInner.style.transform = `translateY(-${scrollPos}px)`;
        } else {
          listInner.style.transform = `translateY(0px)`;
        }

        animationFrame = requestAnimationFrame(step);
      }

      animationFrame = requestAnimationFrame(step);
    }

    async function loadOverlay() {
      try {
        const hunt = await fetchActiveHunt();

        if (!hunt) {
          currentActiveHuntId = null;
          bonusesCache = [];
          document.getElementById("huntTitle").textContent = "Sem hunt ativa";
          document.getElementById("totalBonus").textContent = "0";
          document.getElementById("openCount").textContent = "0/0";
          document.getElementById("progressFill").style.width = "0%";
          document.getElementById("avgX").textContent = "0.00x";
          document.getElementById("beInicial").textContent = "0%";
          document.getElementById("beAberturaCard").style.display = "none";
          document.getElementById("profitLoss").textContent = "0.00€";
          document.getElementById("profitLoss").classList.remove("value-green", "value-red");
          document.getElementById("totalPago").textContent = "0.00€";
          renderBonuses([]);
          return;
        }

        currentActiveHuntId = hunt.id;
        const bonuses = await fetchBonuses(hunt.id);
        bonusesCache = bonuses;

        updateTop(hunt, bonuses);
        updateCards(bonuses);
        renderBonuses(bonuses);
      } catch (error) {
        console.error(error);
      }
    }

    loadOverlay();
    setInterval(loadOverlay, REFRESH_MS);
  </script>
</body>
</html>
