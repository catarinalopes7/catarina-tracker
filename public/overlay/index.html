<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>Catarina Tracker Overlay</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 1080px;
      height: 1920px;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(180deg, #221942, #171126);
      color: #fff;
      padding: 30px;
    }

    .hunt-title {
      text-align: center;
      font-size: 38px;
      font-weight: 800;
      color: #FFD54A;
      margin-bottom: 20px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 15px;
    }

    .box {
      background: rgba(255,255,255,0.08);
      padding: 20px;
      border-radius: 20px;
    }

    .label {
      font-size: 16px;
      color: rgba(255,255,255,0.7);
      margin-bottom: 5px;
    }

    .value {
      font-size: 34px;
      font-weight: 800;
    }

    .progress {
      height: 12px;
      background: rgba(255,255,255,0.1);
      border-radius: 999px;
      margin-top: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg,#FFD54A,#ff9f43);
      width: 0%;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 12px;
      margin-bottom: 15px;
    }

    .card {
      background: rgba(255,255,255,0.08);
      padding: 15px;
      border-radius: 20px;
    }

    .green { color: #44d17a; }
    .red { color: #ff5c7a; }
    .blue { color: #69b7ff; }
    .gold { color: #FFD54A; }

    /* 🔥 NOVA LINHA BEST / WORST */
    .bestworst {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .slot-box {
      background: rgba(255,255,255,0.06);
      padding: 16px;
      border-radius: 20px;
    }

    .slot-name {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .slot-value {
      font-size: 24px;
      font-weight: 800;
    }

    .list {
      height: 1200px;
      overflow: hidden;
    }

    .item {
      background: rgba(255,255,255,0.06);
      padding: 15px;
      border-radius: 15px;
      margin-bottom: 10px;
    }

    .active {
      border: 2px solid #FFD54A;
    }
  </style>
</head>

<body>

<div class="hunt-title" id="huntTitle">A carregar hunt...</div>

<div class="row">
  <div class="box">
    <div class="label">Total Bónus</div>
    <div class="value" id="totalBonus">0</div>
  </div>

  <div class="box">
    <div class="label">Bonus Open</div>
    <div class="value" id="openCount">0/0</div>
    <div class="progress">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>
</div>

<div class="cards">
  <div class="card">
    <div class="label">AVG X</div>
    <div class="value gold" id="avgX">0x</div>
  </div>

  <div class="card">
    <div class="label">BE Inicial</div>
    <div class="value blue" id="beInicial">0%</div>
  </div>

  <div class="card">
    <div class="label">Profit / Loss</div>
    <div class="value" id="profitLoss">0€</div>
  </div>

  <div class="card">
    <div class="label">Total Pago</div>
    <div class="value green" id="totalPago">0€</div>
  </div>
</div>

<!-- 🔥 BEST / WORST -->
<div class="bestworst">
  <div class="slot-box">
    <div class="label">Best Slot</div>
    <div class="slot-name" id="bestName">-</div>
    <div class="slot-value green" id="bestValue">0€</div>
  </div>

  <div class="slot-box">
    <div class="label">Worst Slot</div>
    <div class="slot-name" id="worstName">-</div>
    <div class="slot-value red" id="worstValue">0€</div>
  </div>
</div>

<div class="list" id="list"></div>

<script>
const SUPABASE_URL = "COLOCA_URL";
const SUPABASE_KEY = "COLOCA_KEY";

function euro(v){return Number(v||0).toFixed(2)+"€"}

async function load(){
  const hunt = await fetch(`${SUPABASE_URL}/rest/v1/hunts?is_active=eq.true&limit=1`,{
    headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}
  }).then(r=>r.json()).then(d=>d[0]);

  if(!hunt)return;

  const bonuses = await fetch(`${SUPABASE_URL}/rest/v1/hunt_bonuses?hunt_id=eq.${hunt.id}`,{
    headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}
  }).then(r=>r.json());

  document.getElementById("huntTitle").textContent = hunt.name;

  const opened = bonuses.filter(b=>b.payout>0).length;
  document.getElementById("totalBonus").textContent = bonuses.length;
  document.getElementById("openCount").textContent = `${opened}/${bonuses.length}`;

  document.getElementById("progressFill").style.width =
    bonuses.length ? (opened/bonuses.length*100)+"%" : "0%";

  let totalCost=0,totalPaid=0;

  bonuses.forEach(b=>{
    totalCost += Number(b.buy_amount||0);
    totalPaid += Number(b.payout||0);
  });

  document.getElementById("totalPago").textContent = euro(totalPaid);
  document.getElementById("profitLoss").textContent = euro(totalPaid-totalCost);

  /* 🔥 BEST / WORST */
  let best=null,worst=null;

  bonuses.forEach(b=>{
    if(!best || b.payout > best.payout) best = b;
    if(!worst || b.payout < worst.payout) worst = b;
  });

  if(best){
    document.getElementById("bestName").textContent = best.slot_name || "Slot";
    document.getElementById("bestValue").textContent = euro(best.payout);
  }

  if(worst){
    document.getElementById("worstName").textContent = worst.slot_name || "Slot";
    document.getElementById("worstValue").textContent = euro(worst.payout);
  }

  /* LISTA */
  document.getElementById("list").innerHTML = bonuses.map(b=>`
    <div class="item">
      ${b.slot_name || "Slot"} - Bet ${euro(b.bet)}
      ${b.payout>0 ? " | "+euro(b.payout):""}
    </div>
  `).join("");
}

setInterval(load,2000);
load();
</script>

</body>
</html>
