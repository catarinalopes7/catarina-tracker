<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>Catarina Tracker Overlay</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg-top: #503fc8;
      --bg-bottom: #2a1d73;

      --shell-top: #0f2f73;
      --shell-bottom: #07224f;
      --shell-border: rgba(130, 185, 255, 0.28);

      --card-top: #16428f;
      --card-bottom: #0b2f67;
      --card-border: rgba(124, 177, 255, 0.22);

      --mini-top: #1b4a9d;
      --mini-bottom: #0f356f;

      --text-main: #ffffff;
      --text-soft: rgba(234, 244, 255, 0.76);
      --text-muted: rgba(213, 228, 255, 0.62);

      --yellow: #ffd447;
      --light-blue: #8fd6ff;
      --blue: #2b9dff;
      --green: #72efac;

      --super-soft: rgba(244, 199, 73, 0.18);
      --super-border: rgba(244, 199, 73, 0.50);
      --super-text: #f8d974;

      --epic-soft: rgba(255, 120, 170, 0.16);
      --epic-border: rgba(255, 132, 181, 0.48);
      --epic-text: #ff9ac0;

      --shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
      --radius-shell: 28px;
      --radius-card: 14px;
      --radius-mini: 10px;
    }

    html,
    body {
      width: 1080px;
      height: 1920px;
      margin: 0;
      overflow: hidden;
      font-family: "Sora", Arial, sans-serif;
      color: var(--text-main);
      background:
        radial-gradient(circle at top, rgba(255,255,255,0.08), transparent 24%),
        linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    }

    body {
      padding: 12px 0 12px 14px;
    }

    #app {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: flex-start;
      align-items: flex-start;
    }

    .overlay-shell {
      width: 382px;
      height: 100%;
      border-radius: var(--radius-shell);
      background: linear-gradient(180deg, var(--shell-top), var(--shell-bottom));
      border: 2px solid var(--shell-border);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .overlay-shell::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.08), transparent 14%),
        linear-gradient(90deg, rgba(255,255,255,0.05), transparent 10%, transparent 90%, rgba(0,0,0,0.18));
      opacity: 0.9;
    }

    .top-panel {
      position: relative;
      z-index: 1;
      padding: 10px 10px 8px;
      border-bottom: 1px solid rgba(140, 190, 255, 0.16);
      background: linear-gradient(180deg, rgba(12, 39, 91, 0.96), rgba(6, 28, 67, 0.92));
    }

    .brand-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .brand-left {
      min-width: 0;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .brand-badge {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      flex: 0 0 auto;
      border: 3px solid #34b2ff;
      position: relative;
      box-shadow: 0 0 10px rgba(52, 178, 255, 0.35);
    }

    .brand-badge::before,
    .brand-badge::after {
      content: "";
      position: absolute;
      background: #34b2ff;
      border-radius: 999px;
    }

    .brand-badge::before {
      width: 10px;
      height: 3px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .brand-badge::after {
      width: 3px;
      height: 10px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .brand-text {
      min-width: 0;
    }

    .hunt-title {
      font-size: 26px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.02em;
      color: #ffffff;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 235px;
    }

    .hunt-subtitle {
      margin-top: 2px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-soft);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hunt-id {
      padding-top: 4px;
      font-size: 16px;
      font-weight: 700;
      color: rgba(228, 239, 255, 0.82);
      white-space: nowrap;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      margin-bottom: 7px;
    }

    .stat-card {
      min-height: 50px;
      border-radius: 9px;
      padding: 6px 9px 6px;
      background: linear-gradient(180deg, var(--mini-top), var(--mini-bottom));
      border: 1px solid var(--card-border);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
    }

    .stat-label {
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
      color: rgba(224, 238, 255, 0.76);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .stat-value {
      margin-top: 4px;
      font-size: 18px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.03em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stat-value.yellow { color: var(--yellow); }
    .stat-value.blue { color: var(--light-blue); }
    .stat-value.white { color: #ffffff; }

    .types-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 7px;
    }

    .type-pill {
      min-height: 26px;
      border-radius: 7px;
      padding: 0 9px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 800;
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: 0.01em;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .type-pill.super {
      background: linear-gradient(180deg, rgba(244, 199, 73, 0.20), rgba(244, 199, 73, 0.10));
      border: 1px solid var(--super-border);
      color: var(--super-text);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.08),
        0 0 10px rgba(244, 199, 73, 0.10);
    }

    .type-pill.epic {
      background: linear-gradient(180deg, rgba(255, 120, 170, 0.18), rgba(255, 120, 170, 0.09));
      border: 1px solid var(--epic-border);
      color: var(--epic-text);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.08),
        0 0 10px rgba(255, 120, 170, 0.10);
    }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 0;
    }

    .progress-dot {
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #4bb7ff;
      box-shadow: 0 0 10px rgba(75, 183, 255, 0.55);
    }

    .progress-bar {
      flex: 1;
      height: 7px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #238aff 0%, #5fc4ff 100%);
      transition: width 0.35s ease;
    }

    .progress-text {
      flex: 0 0 auto;
      min-width: 44px;
      text-align: right;
      font-size: 15px;
      font-weight: 800;
      color: #ffffff;
    }

    .list-panel {
      position: relative;
      z-index: 1;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(6, 28, 67, 0.12), rgba(2, 18, 45, 0.22));
    }

    .list-header {
      padding: 10px 12px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid rgba(140, 190, 255, 0.12);
    }

    .list-title {
      font-size: 16px;
      font-weight: 800;
      color: rgba(240, 247, 255, 0.9);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .list-counter {
      font-size: 13px;
      font-weight: 700;
      color: rgba(223, 236, 255, 0.72);
    }

    .slots-scroll {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      position: relative;
    }

    .slots-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px 8px 12px;
      will-change: transform;
    }

    .slot-card {
      border-radius: 10px;
      overflow: hidden;
      background: linear-gradient(180deg, #143b81, #0b2d60);
      border: 1px solid rgba(123, 178, 255, 0.16);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
    }

    .slot-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 8px 5px;
      background: linear-gradient(180deg, rgba(6, 25, 57, 0.18), rgba(0, 0, 0, 0.08));
    }

    .slot-top-left {
      min-width: 0;
    }

    .slot-name {
      font-size: 13px;
      font-weight: 800;
      line-height: 1.05;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 245px;
    }

    .slot-bet {
      margin-top: 2px;
      font-size: 10px;
      font-weight: 700;
      color: rgba(227, 238, 255, 0.82);
      letter-spacing: 0.01em;
    }

    .slot-index {
      flex: 0 0 auto;
      font-size: 12px;
      font-weight: 800;
      color: rgba(230, 240, 255, 0.72);
    }

    .slot-image-wrap {
      width: 100%;
      aspect-ratio: 1 / 0.82;
      background: #081b3e;
      position: relative;
      overflow: hidden;
      border-top: 1px solid rgba(255,255,255,0.04);
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }

    .slot-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      transform: scale(1.02);
    }

    .slot-image-wrap.fallback::before {
      content: "🎰";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      opacity: 0.9;
    }

    .slot-bottom {
      padding: 7px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .slot-type {
      min-height: 24px;
      padding: 0 8px;
      border-radius: 7px;
      display: inline-flex;
      align-items: center;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      border: 1px solid rgba(255,255,255,0.10);
      white-space: nowrap;
    }

    .slot-type.normal {
      background: rgba(255,255,255,0.10);
      color: rgba(255,255,255,0.92);
    }

    .slot-type.super {
      background: linear-gradient(180deg, rgba(244, 199, 73, 0.20), rgba(244, 199, 73, 0.10));
      border-color: rgba(244, 199, 73, 0.45);
      color: var(--super-text);
    }

    .slot-type.epic {
      background: linear-gradient(180deg, rgba(255, 120, 170, 0.18), rgba(255, 120, 170, 0.09));
      border-color: rgba(255, 132, 181, 0.44);
      color: var(--epic-text);
    }

    .slot-status {
      text-align: right;
      min-width: 110px;
    }

    .slot-status.pending {
      color: rgba(225, 237, 255, 0.75);
    }

    .slot-status.opened {
      color: var(--green);
    }

    .slot-status-label {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      opacity: 0.86;
    }

    .slot-status-value {
      margin-top: 2px;
      font-size: 18px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.03em;
      white-space: nowrap;
    }

    .footer-stats {
      padding: 8px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      border-top: 1px solid rgba(140, 190, 255, 0.12);
      background: linear-gradient(180deg, rgba(9, 33, 77, 0.92), rgba(6, 24, 56, 0.96));
    }

    .footer-box {
      min-height: 52px;
      border-radius: 10px;
      padding: 7px 8px;
      background: linear-gradient(180deg, #173f87, #0d2f65);
      border: 1px solid rgba(123, 178, 255, 0.18);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .footer-box.total {
      grid-column: span 2;
      min-height: 56px;
      align-items: center;
      text-align: center;
    }

    .footer-label {
      font-size: 11px;
      font-weight: 700;
      color: rgba(226, 238, 255, 0.74);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      line-height: 1;
    }

    .footer-value {
      margin-top: 5px;
      font-size: 22px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.03em;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .footer-value.green {
      color: var(--green);
    }

    .footer-value.blue {
      color: var(--light-blue);
    }

    .loading-state,
    .empty-state {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      color: rgba(222, 236, 255, 0.72);
      font-size: 20px;
      font-weight: 700;
      line-height: 1.3;
    }

    .hide {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="overlay-shell">
      <section class="top-panel">
        <div class="brand-row">
          <div class="brand-left">
            <div class="brand-badge"></div>
            <div class="brand-text">
              <div id="huntTitle" class="hunt-title">Bonus Hunt</div>
              <div id="huntSubtitle" class="hunt-subtitle">Sem hunt ativa</div>
            </div>
          </div>
          <div id="huntId" class="hunt-id">#000</div>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">Start</div>
            <div id="statStart" class="stat-value yellow">0€</div>
          </div>

          <div class="stat-card">
            <div class="stat-label">Breakeven</div>
            <div id="statBreakeven" class="stat-value blue">0%</div>
          </div>

          <div class="stat-card">
            <div class="stat-label">Bonuses</div>
            <div id="statBonuses" class="stat-value white">0</div>
          </div>

          <div class="stat-card">
            <div class="stat-label">Opening</div>
            <div id="statOpening" class="stat-value blue">0/0</div>
          </div>
        </div>

        <div class="types-row">
          <div class="type-pill super">
            <span>Super</span>
            <span id="statSuper">0</span>
          </div>
          <div class="type-pill epic">
            <span>Epic</span>
            <span id="statEpic">0</span>
          </div>
        </div>

        <div class="progress-row">
          <div class="progress-dot"></div>
          <div class="progress-bar">
            <div id="progressFill" class="progress-fill"></div>
          </div>
          <div id="progressText" class="progress-text">0/0</div>
        </div>
      </section>

      <section class="list-panel">
        <div class="list-header">
          <div class="list-title">Hunt</div>
          <div id="listCounter" class="list-counter">0 slots</div>
        </div>

        <div id="slotsScroll" class="slots-scroll">
          <div id="loadingState" class="loading-state">A carregar overlay...</div>
          <div id="emptyState" class="empty-state hide">Sem slots para mostrar.</div>
          <div id="slotsList" class="slots-list hide"></div>
        </div>
      </section>

      <section class="footer-stats">
        <div class="footer-box">
          <div class="footer-label">Average</div>
          <div id="footerAverage" class="footer-value">0.00x</div>
        </div>

        <div class="footer-box">
          <div class="footer-label">Breakeven</div>
          <div id="footerBreakeven" class="footer-value blue">0%</div>
        </div>

        <div class="footer-box total">
          <div class="footer-label">Total Pay</div>
          <div id="footerTotalPay" class="footer-value green">0€</div>
        </div>
      </section>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL =
      window.CT_SUPABASE_URL ||
      window.SUPABASE_URL ||
      window.ENV?.SUPABASE_URL ||
      localStorage.getItem("SUPABASE_URL") ||
      "";

    const SUPABASE_ANON_KEY =
      window.CT_SUPABASE_ANON_KEY ||
      window.SUPABASE_ANON_KEY ||
      window.ENV?.SUPABASE_ANON_KEY ||
      localStorage.getItem("SUPABASE_ANON_KEY") ||
      "";

    const refreshMs = 5000;

    const listEl = document.getElementById("slotsList");
    const loadingEl = document.getElementById("loadingState");
    const emptyEl = document.getElementById("emptyState");
    const scrollEl = document.getElementById("slotsScroll");

    const els = {
      huntTitle: document.getElementById("huntTitle"),
      huntSubtitle: document.getElementById("huntSubtitle"),
      huntId: document.getElementById("huntId"),
      progressFill: document.getElementById("progressFill"),
      progressText: document.getElementById("progressText"),
      listCounter: document.getElementById("listCounter"),
      statStart: document.getElementById("statStart"),
      statBreakeven: document.getElementById("statBreakeven"),
      statBonuses: document.getElementById("statBonuses"),
      statOpening: document.getElementById("statOpening"),
      statSuper: document.getElementById("statSuper"),
      statEpic: document.getElementById("statEpic"),
      footerAverage: document.getElementById("footerAverage"),
      footerBreakeven: document.getElementById("footerBreakeven"),
      footerTotalPay: document.getElementById("footerTotalPay")
    };

    let supabase = null;
    let autoScrollY = 0;
    let autoScrollDirection = 1;
    let lastRenderedSignature = "";

    function euro(value) {
      const n = Number(value || 0);
      return new Intl.NumberFormat("pt-PT", {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
      }).format(n) + "€";
    }

    function pct(value) {
      const n = Number(value || 0);
      return new Intl.NumberFormat("pt-PT", {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
      }).format(n) + "%";
    }

    function num(value) {
      return new Intl.NumberFormat("pt-PT").format(Number(value || 0));
    }

    function multi(value) {
      const n = Number(value || 0);
      return new Intl.NumberFormat("pt-PT", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }).format(n) + "x";
    }

    function pick(obj, keys, fallback = null) {
      if (!obj) return fallback;
      for (const key of keys) {
        if (obj[key] !== undefined && obj[key] !== null && obj[key] !== "") {
          return obj[key];
        }
      }
      return fallback;
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function isOpened(item) {
      const raw = String(
        pick(item, [
          "status",
          "state",
          "opening_status",
          "result_status"
        ], "")
      ).toLowerCase();

      if (raw) {
        return ["opened", "open", "done", "finished", "paid", "completed"].includes(raw);
      }

      if (pick(item, ["opened", "is_opened", "opened_bonus"], false) === true) return true;
      if (pick(item, ["opened_at", "completed_at", "finished_at"], null)) return true;

      const payout = Number(pick(item, ["payout", "result", "win_amount", "paid_amount"], 0) || 0);
      return payout > 0;
    }

    function normalizeBonusType(item) {
      const raw = String(
        pick(item, ["bonus_type", "type", "rarity", "tier"], "normal")
      ).toLowerCase();

      if (raw.includes("epic")) return "epic";
      if (raw.includes("super")) return "super";
      return "normal";
    }

    function normalizeSlot(item, index = 0) {
      return {
        id: pick(item, ["id", "slot_id", "bonus_id"], "slot-" + index),
        name: pick(item, ["slot_name", "name", "title", "slot"], "Slot"),
        image: pick(item, ["slot_image", "image_url", "image", "thumb", "thumbnail_url"], ""),
        type: normalizeBonusType(item),
        payout: Number(pick(item, ["payout", "result", "paid_amount", "win_amount"], 0) || 0),
        bet: Number(pick(item, ["bet", "bet_size", "base_bet", "stake"], 0) || 0),
        opened: isOpened(item),
        order:
          Number(
            pick(item, ["sort_order", "position", "display_order", "order_index"], index)
          ) || index
      };
    }

    async function tryGetActiveHunt() {
      const huntTables = ["hunts", "bonus_hunts", "hunt_sessions"];
      const strategies = [
        (q) => q.eq("is_active", true),
        (q) => q.eq("active", true),
        (q) => q.eq("status", "active")
      ];

      for (const table of huntTables) {
        for (const applyStrategy of strategies) {
          try {
            let query = supabase
              .from(table)
              .select("*")
              .order("updated_at", { ascending: false })
              .limit(1);

            query = applyStrategy(query);

            const { data, error } = await query;
            if (!error && Array.isArray(data) && data.length) {
              return { table, hunt: data[0] };
            }
          } catch (_) {}
        }

        try {
          const { data, error } = await supabase
            .from(table)
            .select("*")
            .order("updated_at", { ascending: false })
            .order("created_at", { ascending: false })
            .limit(10);

          if (!error && Array.isArray(data) && data.length) {
            const active = data.find((row) => {
              const isActive = pick(row, ["is_active", "active"], false) === true;
              const status = String(pick(row, ["status"], "")).toLowerCase() === "active";
              return isActive || status;
            });

            if (active) return { table, hunt: active };
          }
        } catch (_) {}
      }

      return null;
    }

    async function tryGetBonuses(huntId) {
      const bonusTables = ["hunt_entries", "hunt_items", "hunt_bonuses", "bonuses"];
      const possibleHuntKeys = ["hunt_id", "bonus_hunt_id", "session_id"];

      for (const table of bonusTables) {
        for (const huntKey of possibleHuntKeys) {
          try {
            const { data, error } = await supabase
              .from(table)
              .select("*")
              .eq(huntKey, huntId)
              .order("sort_order", { ascending: true })
              .order("position", { ascending: true })
              .order("created_at", { ascending: true });

            if (!error && Array.isArray(data)) {
              return data;
            }
          } catch (_) {}
        }
      }

      return [];
    }

    function computeStats(hunt, slots) {
      const start = Number(
        pick(hunt, ["start_balance", "start", "starting_balance", "hunt_start"], 0) || 0
      );

      const total = slots.length;
      const openedSlots = slots.filter((s) => s.opened);
      const opened = openedSlots.length;
      const totalPaid = openedSlots.reduce((sum, s) => sum + Number(s.payout || 0), 0);
      const breakevenPct = start > 0 ? (totalPaid / start) * 100 : 0;
      const averageX = start > 0 && opened > 0 ? totalPaid / start : 0;
      const superCount = slots.filter((s) => s.type === "super").length;
      const epicCount = slots.filter((s) => s.type === "epic").length;

      return {
        start,
        total,
        opened,
        totalPaid,
        breakevenPct,
        averageX,
        superCount,
        epicCount
      };
    }

    function setMainState(message) {
      loadingEl.textContent = message;
      loadingEl.classList.remove("hide");
      emptyEl.classList.add("hide");
      listEl.classList.add("hide");
      listEl.innerHTML = "";
    }

    function setEmptyState(message) {
      loadingEl.classList.add("hide");
      emptyEl.textContent = message;
      emptyEl.classList.remove("hide");
      listEl.classList.add("hide");
      listEl.innerHTML = "";
    }

    function renderNoActiveHunt() {
      els.huntTitle.textContent = "Bonus Hunt";
      els.huntSubtitle.textContent = "Sem hunt ativa";
      els.huntId.textContent = "#000";

      els.progressFill.style.width = "0%";
      els.progressText.textContent = "0/0";

      els.statStart.textContent = "0€";
      els.statBreakeven.textContent = "0%";
      els.statBonuses.textContent = "0";
      els.statOpening.textContent = "0/0";
      els.statSuper.textContent = "0";
      els.statEpic.textContent = "0";

      els.footerAverage.textContent = "0.00x";
      els.footerBreakeven.textContent = "0%";
      els.footerTotalPay.textContent = "0€";

      els.listCounter.textContent = "0 slots";
      setEmptyState("Sem hunt ativa.");
    }

    function renderHeader(hunt, stats) {
      const huntName = pick(hunt, ["name", "title"], "Bonus Hunt");
      const huntSubtitle = pick(hunt, ["provider", "subtitle", "label"], "Hunt ativa");
      const huntId = pick(hunt, ["display_id", "hunt_number", "number", "id"], "000");

      els.huntTitle.textContent = huntName;
      els.huntSubtitle.textContent = String(huntSubtitle);
      els.huntId.textContent = "#" + String(huntId);

      const progress = stats.total > 0 ? (stats.opened / stats.total) * 100 : 0;
      els.progressFill.style.width = Math.max(0, Math.min(progress, 100)) + "%";
      els.progressText.textContent = `${num(stats.opened)}/${num(stats.total)}`;

      els.statStart.textContent = euro(stats.start);
      els.statBreakeven.textContent = pct(stats.breakevenPct);
      els.statBonuses.textContent = num(stats.total);
      els.statOpening.textContent = `${num(stats.opened)}/${num(stats.total)}`;
      els.statSuper.textContent = num(stats.superCount);
      els.statEpic.textContent = num(stats.epicCount);

      els.footerAverage.textContent = multi(stats.averageX);
      els.footerBreakeven.textContent = pct(stats.breakevenPct);
      els.footerTotalPay.textContent = euro(stats.totalPaid);

      els.listCounter.textContent = `${num(stats.total)} slots`;
    }

    function slotCardTemplate(slot, index) {
      const imageMarkup = slot.image
        ? `<img class="slot-image" src="${slot.image}" alt="${escapeHtml(slot.name)}" onerror="this.parentNode.classList.add('fallback'); this.remove();" />`
        : "";

      const statusMarkup = slot.opened
        ? `
          <div class="slot-status opened">
            <div class="slot-status-label">Payout</div>
            <div class="slot-status-value">${euro(slot.payout)}</div>
          </div>
        `
        : `
          <div class="slot-status pending">
            <div class="slot-status-label">Estado</div>
            <div class="slot-status-value">Pendente</div>
          </div>
        `;

      return `
        <div class="slot-card">
          <div class="slot-top">
            <div class="slot-top-left">
              <div class="slot-name">${escapeHtml(slot.name)}</div>
              <div class="slot-bet">${slot.bet > 0 ? euro(slot.bet) : "&nbsp;"}</div>
            </div>
            <div class="slot-index">#${index + 1}</div>
          </div>

          <div class="slot-image-wrap ${slot.image ? "" : "fallback"}">
            ${imageMarkup}
          </div>

          <div class="slot-bottom">
            <div class="slot-type ${slot.type}">${slot.type}</div>
            ${statusMarkup}
          </div>
        </div>
      `;
    }

    function renderSlots(slots) {
      if (!slots.length) {
        setEmptyState("Esta hunt ainda não tem slots.");
        return;
      }

      const signature = JSON.stringify(
        slots.map((s) => [s.id, s.name, s.image, s.type, s.payout, s.bet, s.opened, s.order])
      );

      if (signature !== lastRenderedSignature) {
        lastRenderedSignature = signature;
        listEl.innerHTML = slots.map((slot, index) => slotCardTemplate(slot, index)).join("");
      }

      loadingEl.classList.add("hide");
      emptyEl.classList.add("hide");
      listEl.classList.remove("hide");
    }

    function startAutoScroll() {
      const speed = 0.38;

      function step() {
        const maxScroll = Math.max(0, listEl.scrollHeight - scrollEl.clientHeight);

        if (maxScroll <= 0 || listEl.classList.contains("hide")) {
          listEl.style.transform = "translateY(0px)";
          autoScrollY = 0;
          requestAnimationFrame(step);
          return;
        }

        autoScrollY += speed * autoScrollDirection;

        if (autoScrollY >= maxScroll) {
          autoScrollY = maxScroll;
          autoScrollDirection = -1;
        } else if (autoScrollY <= 0) {
          autoScrollY = 0;
          autoScrollDirection = 1;
        }

        listEl.style.transform = `translateY(${-autoScrollY}px)`;
        requestAnimationFrame(step);
      }

      requestAnimationFrame(step);
    }

    async function loadOverlay() {
      if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
        els.huntTitle.textContent = "Configuração";
        els.huntSubtitle.textContent = "Supabase em falta";
        els.huntId.textContent = "#ERR";
        setMainState("Faltam as credenciais do Supabase neste overlay.");
        return;
      }

      if (!supabase) {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }

      try {
        const active = await tryGetActiveHunt();

        if (!active || !active.hunt) {
          renderNoActiveHunt();
          return;
        }

        const hunt = active.hunt;
        const huntId = pick(hunt, ["id"]);

        const rawBonuses = await tryGetBonuses(huntId);
        const slots = rawBonuses
          .map((item, index) => normalizeSlot(item, index))
          .sort((a, b) => a.order - b.order);

        const stats = computeStats(hunt, slots);

        renderHeader(hunt, stats);
        renderSlots(slots);
      } catch (error) {
        console.error(error);
        els.huntTitle.textContent = "Erro";
        els.huntSubtitle.textContent = "Não foi possível carregar";
        els.huntId.textContent = "#ERR";
        setMainState("Erro ao carregar a hunt.");
      }
    }

    startAutoScroll();
    loadOverlay();
    setInterval(loadOverlay, refreshMs);
  </script>
</body>
</html>
