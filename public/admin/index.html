<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<title>Catarina Tracker - Admin</title>

<style>
body{background:#0f1221;color:#fff;font-family:Arial;padding:20px}
table{width:100%;border-collapse:collapse}
td,th{padding:10px;border-bottom:1px solid #333;text-align:left}
tr:hover{background:#1a1f3a}
input{padding:6px;border-radius:6px;border:none;width:80px}
button{padding:8px 12px;border:none;border-radius:8px;cursor:pointer}
.green{color:#00ffa6}
.red{color:#ff5d73}
</style>
</head>

<body>

<h2>Catarina Tracker - Admin</h2>

<h3>Hunts</h3>
<table>
<thead>
<tr>
<th>ID</th>
<th>Nome</th>
<th>Start</th>
<th>Ação</th>
</tr>
</thead>
<tbody id="hunts"></tbody>
</table>

<h3>Slots</h3>
<table>
<thead>
<tr>
<th>ID</th>
<th>Slot</th>
<th>Bet</th>
<th>Payout</th>
<th>Estado</th>
</tr>
</thead>
<tbody id="slots"></tbody>
</table>

<script>
const SUPABASE_URL = "https://cwengomkuhqvrdcpkgwp.supabase.co";
const SUPABASE_KEY = "sb_publishable_Hi1T9WK_snEgqPep5JJnRQ__HSJXQUs";

let selectedHunt = null;

function headers(){
return {
apikey: SUPABASE_KEY,
Authorization: "Bearer " + SUPABASE_KEY,
"Content-Type":"application/json"
}
}

// ==================== HUNTS ====================

async function loadHunts(){
const res = await fetch(`${SUPABASE_URL}/rest/v1/hunts?select=*`,{
headers:headers()
});
const data = await res.json();

const tbody = document.getElementById("hunts");
tbody.innerHTML="";

data.forEach(h=>{
const tr = document.createElement("tr");
tr.innerHTML = `
<td>${h.id}</td>
<td>${h.nome}</td>
<td>${h.start_balance}</td>
<td><button onclick="openHunt(${h.id})">Abrir</button></td>
`;
tbody.appendChild(tr);
});
}

function openHunt(id){
selectedHunt = id;
loadSlots();
}

// ==================== SLOTS ====================

async function loadSlots(){
if(!selectedHunt)return;

const res = await fetch(`${SUPABASE_URL}/rest/v1/hunt_slots?hunt_id=eq.${selectedHunt}&select=*`,{
headers:headers()
});

const data = await res.json();
const tbody = document.getElementById("slots");
tbody.innerHTML="";

data.forEach(slot=>{
const tr = document.createElement("tr");

const estado = slot.payout > 0 ? 
'<span class="green">BONUS OPENING</span>' : 
'<span class="red">FECHADO</span>';

tr.innerHTML = `
<td>${slot.id}</td>
<td>${slot.slot_name}</td>
<td>${slot.bet_size}</td>
<td onclick="editPayout(this, ${slot.id}, ${slot.payout})">${Number(slot.payout).toFixed(2)}</td>
<td>${estado}</td>
`;

tbody.appendChild(tr);
});
}

// ==================== EDIT PAYOUT ====================

function editPayout(td, id, currentValue){

const input = document.createElement("input");
input.value = currentValue;
td.innerHTML="";
td.appendChild(input);
input.focus();

input.addEventListener("keydown", async (e)=>{

if(e.key === "Enter"){
const newValue = parseFloat(input.value) || 0;

await fetch(`${SUPABASE_URL}/rest/v1/hunt_slots?id=eq.${id}`,{
method:"PATCH",
headers:headers(),
body:JSON.stringify({
payout:newValue,
status: newValue > 0 ? "open" : "pending"
})
});

loadSlots();
}

if(e.key === "Escape"){
loadSlots();
}

});
}

// ==================== INIT ====================

loadHunts();
</script>

</body>
</html>
