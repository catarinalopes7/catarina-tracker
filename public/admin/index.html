<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catarina Tracker - Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #151515;
      color: #fff;
      padding: 24px;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 28px;
    }

    .layout {
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 24px;
      align-items: start;
    }

    .card {
      background: #222;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 18px;
    }

    .card h2 {
      margin: 0 0 16px;
      font-size: 20px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #cfcfcf;
    }

    .field input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #444;
      background: #111;
      color: #fff;
      font-size: 15px;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary {
      background: #ffd54a;
      color: #111;
    }

    .btn-secondary {
      background: #3b82f6;
      color: #fff;
    }

    .btn-danger {
      background: #ef4444;
      color: #fff;
    }

    .btn-muted {
      background: #444;
      color: #fff;
    }

    .hunt-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .hunt-item {
      background: #1a1a1a;
      border: 1px solid #353535;
      border-radius: 14px;
      padding: 16px;
    }

    .hunt-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .hunt-name {
      font-size: 18px;
      font-weight: 700;
    }

    .badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    .badge-active {
      background: #16a34a;
      color: #fff;
    }

    .badge-closed {
      background: #ef4444;
      color: #fff;
    }

    .badge-idle {
      background: #525252;
      color: #fff;
    }

    .hunt-meta {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .meta-box {
      background: #111;
      border: 1px solid #2f2f2f;
      border-radius: 10px;
      padding: 10px;
    }

    .meta-label {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .meta-value {
      font-size: 16px;
      font-weight: 700;
    }

    .status {
      margin-top: 12px;
      font-size: 14px;
      color: #ddd;
      min-height: 20px;
    }

    .hint {
      font-size: 13px;
      color: #aaa;
      margin-top: 8px;
      line-height: 1.4;
    }

    @media (max-width: 1100px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .hunt-meta {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <h1>Catarina Tracker - Admin</h1>

  <div class="layout">
    <div class="card">
      <h2>Criar Hunt</h2>

      <div class="field">
        <label for="huntName">Nome da hunt</label>
        <input id="huntName" type="text" placeholder="Ex: Hunt Abril #1" />
      </div>

      <div class="field">
        <label for="huntStart">Start</label>
        <input id="huntStart" type="number" min="0" step="0.01" placeholder="Ex: 1000" />
      </div>

      <div class="hint">
        O Start é o valor inicial fixo da hunt. Exemplo: se começares com 1000€, este valor fica sempre 1000€ no overlay.
      </div>

      <div class="actions">
        <button id="createHuntBtn" class="btn-primary">Criar Hunt</button>
        <button id="refreshBtn" class="btn-muted">Atualizar Lista</button>
      </div>

      <div id="status" class="status"></div>
    </div>

    <div class="card">
      <h2>Hunts</h2>
      <div id="huntList" class="hunt-list"></div>
    </div>
  </div>

  <script src="./conexao.js"></script>
  <script>
    const huntNameInput = document.getElementById("huntName");
    const huntStartInput = document.getElementById("huntStart");
    const createHuntBtn = document.getElementById("createHuntBtn");
    const refreshBtn = document.getElementById("refreshBtn");
    const huntList = document.getElementById("huntList");
    const statusEl = document.getElementById("status");

    function setStatus(message) {
      statusEl.textContent = message || "";
    }

    function getStatusBadge(hunt) {
      if (hunt.is_active) {
        return `<span class="badge badge-active">ATIVA</span>`;
      }

      if (hunt.is_closed) {
        return `<span class="badge badge-closed">FECHADA</span>`;
      }

      return `<span class="badge badge-idle">PARADA</span>`;
    }

    async function renderHunts() {
      try {
        huntList.innerHTML = `<div class="hunt-item">A carregar hunts...</div>`;

        const hunts = await getAllHunts();

        if (!hunts.length) {
          huntList.innerHTML = `<div class="hunt-item">Ainda não existem hunts.</div>`;
          return;
        }

        const rows = await Promise.all(
          hunts.map(async (hunt) => {
            const bonuses = await getBonusesByHunt(hunt.id);
            const totalBonus = bonuses.length;
            const totalPaid = getTotalPaid(bonuses);
            const profitLoss = getProfitLoss(bonuses);
            const startValue = safeNumber(hunt.start_value);

            return `
              <div class="hunt-item">
                <div class="hunt-top">
                  <div class="hunt-name">${escapeHtml(hunt.name || "Sem nome")}</div>
                  <div>${getStatusBadge(hunt)}</div>
                </div>

                <div class="hunt-meta">
                  <div class="meta-box">
                    <div class="meta-label">Start</div>
                    <div class="meta-value">${euro(startValue)}</div>
                  </div>

                  <div class="meta-box">
                    <div class="meta-label">Bónus</div>
                    <div class="meta-value">${totalBonus}</div>
                  </div>

                  <div class="meta-box">
                    <div class="meta-label">Total Pago</div>
                    <div class="meta-value">${euro(totalPaid)}</div>
                  </div>

                  <div class="meta-box">
                    <div class="meta-label">Profit/Loss</div>
                    <div class="meta-value">${euro(profitLoss)}</div>
                  </div>
                </div>

                <div class="actions">
                  <button class="btn-secondary" onclick="handleActivate(${hunt.id})">Ativar</button>
                  <button class="btn-danger" onclick="handleClose(${hunt.id})">Fechar</button>
                </div>
              </div>
            `;
          })
        );

        huntList.innerHTML = rows.join("");
      } catch (error) {
        console.error(error);
        huntList.innerHTML = `<div class="hunt-item">Erro ao carregar hunts.</div>`;
      }
    }

    async function handleCreateHunt() {
      try {
        const name = huntNameInput.value.trim();
        const startValue = safeNumber(huntStartInput.value);

        if (!name) {
          setStatus("Escreve o nome da hunt.");
          return;
        }

        if (startValue <= 0) {
          setStatus("Mete um valor Start válido.");
          return;
        }

        createHuntBtn.disabled = true;
        setStatus("A criar hunt...");

        await createHunt({ name, startValue });

        huntNameInput.value = "";
        huntStartInput.value = "";

        setStatus("Hunt criada com sucesso.");
        await renderHunts();
      } catch (error) {
        console.error(error);
        setStatus("Erro ao criar hunt. Confirma se a coluna start_value já existe.");
      } finally {
        createHuntBtn.disabled = false;
      }
    }

    async function handleActivate(huntId) {
      try {
        setStatus("A ativar hunt...");
        await activateHunt(huntId);
        setStatus("Hunt ativada com sucesso.");
        await renderHunts();
      } catch (error) {
        console.error(error);
        setStatus("Erro ao ativar hunt.");
      }
    }

    async function handleClose(huntId) {
      try {
        setStatus("A fechar hunt...");
        await closeHunt(huntId);
        setStatus("Hunt fechada com sucesso.");
        await renderHunts();
      } catch (error) {
        console.error(error);
        setStatus("Erro ao fechar hunt.");
      }
    }

    createHuntBtn.addEventListener("click", handleCreateHunt);
    refreshBtn.addEventListener("click", renderHunts);

    window.handleActivate = handleActivate;
    window.handleClose = handleClose;

    renderHunts();
  </script>
</body>
</html>
