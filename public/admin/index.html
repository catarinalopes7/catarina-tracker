<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catarina Tracker - Admin</title>

  <style>
    :root{
      --bg:#0f1221;
      --panel:#171a2e;
      --panel-2:#1e223d;
      --line:rgba(255,255,255,.08);
      --text:#f4f6ff;
      --muted:#aab0d3;
      --gold:#ffd54a;
      --green:#20d18f;
      --red:#ff5d73;
      --blue:#6ea8ff;
      --shadow:0 14px 35px rgba(0,0,0,.28);
      --radius:18px;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:Inter, Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(122,92,255,.18), transparent 30%),
        radial-gradient(circle at top right, rgba(255,213,74,.10), transparent 25%),
        linear-gradient(180deg, #0c1020, #11152a 55%, #0f1221 100%);
      color:var(--text);
      min-height:100vh;
      padding:24px;
    }

    .wrap{
      max-width:1280px;
      margin:0 auto;
    }

    .topbar{
      display:flex;
      gap:16px;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap;
      margin-bottom:24px;
    }

    .title-box h1{
      margin:0;
      font-size:32px;
      line-height:1.1;
      color:var(--gold);
      font-weight:800;
      letter-spacing:.2px;
    }

    .title-box p{
      margin:8px 0 0;
      color:var(--muted);
      font-size:14px;
    }

    .actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    button{
      border:0;
      border-radius:12px;
      padding:12px 16px;
      font-size:14px;
      font-weight:700;
      cursor:pointer;
      transition:.18s ease;
    }

    button:hover{
      transform:translateY(-1px);
      filter:brightness(1.04);
    }

    button:disabled{
      opacity:.55;
      cursor:not-allowed;
      transform:none;
    }

    .btn-primary{
      background:linear-gradient(135deg, var(--gold), #ffbf1f);
      color:#181818;
    }

    .btn-secondary{
      background:var(--panel-2);
      color:var(--text);
      border:1px solid var(--line);
    }

    .btn-green{
      background:linear-gradient(135deg, #23d89a, #13b77d);
      color:#07140f;
    }

    .btn-red{
      background:linear-gradient(135deg, #ff6f82, #f14b62);
      color:white;
    }

    .btn-blue{
      background:linear-gradient(135deg, #77b4ff, #4f92ff);
      color:#071427;
    }

    .grid{
      display:grid;
      grid-template-columns: 360px 1fr;
      gap:20px;
    }

    @media (max-width: 980px){
      .grid{
        grid-template-columns:1fr;
      }
    }

    .card{
      background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.015));
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .card-header{
      padding:18px 20px;
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .card-header h2{
      margin:0;
      font-size:18px;
      font-weight:800;
    }

    .card-body{
      padding:20px;
    }

    .form-grid{
      display:grid;
      gap:14px;
    }

    .field label{
      display:block;
      margin-bottom:7px;
      font-size:13px;
      color:var(--muted);
      font-weight:700;
    }

    .field input{
      width:100%;
      border:1px solid rgba(255,255,255,.09);
      background:#11162a;
      color:var(--text);
      border-radius:12px;
      padding:13px 14px;
      font-size:15px;
      outline:none;
    }

    .field input:focus{
      border-color:rgba(255,213,74,.55);
      box-shadow:0 0 0 3px rgba(255,213,74,.12);
    }

    .muted{
      color:var(--muted);
      font-size:13px;
      line-height:1.5;
    }

    .statusbar{
      margin-top:14px;
      padding:12px 14px;
      border-radius:12px;
      background:#101427;
      border:1px solid var(--line);
      color:var(--muted);
      font-size:13px;
      min-height:44px;
      display:flex;
      align-items:center;
      white-space:pre-wrap;
    }

    .status-ok{
      color:#8df0c6;
    }

    .status-err{
      color:#ff9aa7;
    }

    .table-wrap{
      overflow:auto;
    }

    table{
      width:100%;
      border-collapse:collapse;
      min-width:860px;
    }

    thead th{
      text-align:left;
      font-size:12px;
      letter-spacing:.4px;
      text-transform:uppercase;
      color:var(--muted);
      padding:14px 16px;
      border-bottom:1px solid var(--line);
      background:rgba(255,255,255,.02);
      position:sticky;
      top:0;
      z-index:2;
    }

    tbody td{
      padding:15px 16px;
      border-bottom:1px solid rgba(255,255,255,.06);
      vertical-align:middle;
      font-size:14px;
    }

    tbody tr:hover{
      background:rgba(255,255,255,.025);
    }

    .hunt-name{
      font-weight:800;
      color:#fff;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:88px;
      padding:7px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:800;
      letter-spacing:.2px;
      border:1px solid transparent;
    }

    .pill-active{
      background:rgba(32,209,143,.14);
      color:#8df0c6;
      border-color:rgba(32,209,143,.22);
    }

    .pill-closed{
      background:rgba(255,93,115,.12);
      color:#ff9aa7;
      border-color:rgba(255,93,115,.20);
    }

    .pill-draft{
      background:rgba(110,168,255,.12);
      color:#9ec4ff;
      border-color:rgba(110,168,255,.20);
    }

    .row-actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .row-actions button{
      padding:9px 12px;
      font-size:12px;
      border-radius:10px;
    }

    .right-note{
      color:var(--muted);
      font-size:12px;
    }

    .debug-box{
      margin-top:14px;
      padding:12px 14px;
      border-radius:12px;
      background:#0e1325;
      border:1px solid var(--line);
      color:#9ec4ff;
      font-size:12px;
      line-height:1.5;
      white-space:pre-wrap;
    }

    code{
      background:rgba(255,255,255,.06);
      padding:2px 6px;
      border-radius:6px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="title-box">
        <h1>Catarina Tracker — Admin</h1>
        <p>Gestão de Bonus Hunts com Supabase REST</p>
      </div>

      <div class="actions">
        <button class="btn-secondary" id="refreshBtn">Atualizar lista</button>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="card-header">
          <h2>Nova Hunt</h2>
        </div>

        <div class="card-body">
          <div class="form-grid">
            <div class="field">
              <label for="huntName">Nome da hunt</label>
              <input id="huntName" type="text" placeholder="Ex: Hunt 2000€ / Gates / Pragmatic" />
            </div>

            <div class="field">
              <label for="huntStart">Start</label>
              <input id="huntStart" type="number" step="0.01" placeholder="2000" />
            </div>

            <button class="btn-primary" id="createHuntBtn">Criar Hunt</button>

            <div class="muted">
              Esta versão tenta casar automaticamente com mais formatos de colunas da tabela <code>hunts</code>.
            </div>

            <div class="statusbar" id="statusBox">Pronto.</div>
            <div class="debug-box" id="debugBox">Debug: à espera de dados...</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h2>Hunts</h2>
          <div class="right-note" id="huntCount">0 hunts</div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Start</th>
                <th>Estado</th>
                <th>Criada em</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="huntsTableBody">
              <tr>
                <td colspan="6" class="muted" style="padding:18px 16px;">A carregar hunts...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://cwengomkuhqvrdcpkgwp.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Hi1T9WK_snEgqPep5JJnRQ__HSJXQUs";

    const huntNameInput = document.getElementById("huntName");
    const huntStartInput = document.getElementById("huntStart");
    const createHuntBtn = document.getElementById("createHuntBtn");
    const refreshBtn = document.getElementById("refreshBtn");
    const huntsTableBody = document.getElementById("huntsTableBody");
    const huntCount = document.getElementById("huntCount");
    const statusBox = document.getElementById("statusBox");
    const debugBox = document.getElementById("debugBox");

    const NAME_KEYS = [
      "name", "title", "hunt_name", "hunt_title", "label", "display_name",
      "nome", "hunt", "hunt_label", "bonus_hunt_name"
    ];

    const START_KEYS = [
      "start_value", "start_balance", "start", "balance_start", "initial_balance",
      "starting_balance", "starting_value", "start_amount", "hunt_start",
      "initial_value", "bankroll_start", "bankroll_initial", "opening_balance",
      "start_bankroll", "valor_inicial"
    ];

    const CREATED_KEYS = [
      "created_at", "inserted_at", "date_created", "createdAt", "created_on", "created"
    ];

    function setStatus(message, type = "") {
      statusBox.textContent = message;
      statusBox.className = "statusbar";
      if (type === "ok") statusBox.classList.add("status-ok");
      if (type === "err") statusBox.classList.add("status-err");
    }

    function setDebug(message) {
      debugBox.textContent = message;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatMoney(value) {
      const num = Number(value || 0);
      return Number.isFinite(num) ? num.toFixed(2) : "0.00";
    }

    function formatDate(value) {
      if (!value) return "-";
      const d = new Date(value);
      if (isNaN(d.getTime())) return String(value);
      return d.toLocaleString("pt-PT");
    }

    function getHeaders(extra = {}) {
      return {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`,
        "Content-Type": "application/json",
        Prefer: "return=representation",
        ...extra
      };
    }

    async function fetchJson(path, options = {}) {
      const res = await fetch(`${SUPABASE_URL}${path}`, options);
      const text = await res.text();

      let data = null;
      try {
        data = text ? JSON.parse(text) : null;
      } catch {
        data = text;
      }

      if (!res.ok) {
        const message =
          (data && data.message) ||
          (data && data.error) ||
          (data && data.hint) ||
          (typeof data === "string" ? data : "") ||
          `Erro HTTP ${res.status}`;
        throw new Error(message);
      }

      return data;
    }

    function firstExisting(row, keys) {
      for (const key of keys) {
        if (row[key] !== undefined && row[key] !== null && row[key] !== "") {
          return row[key];
        }
      }
      return null;
    }

    function getStartValue(row) {
      const value = firstExisting(row, START_KEYS);
      return value ?? 0;
    }

    function getHuntName(row) {
      const value = firstExisting(row, NAME_KEYS);
      return value ?? `Hunt #${row.id ?? "?"}`;
    }

    function getCreatedAt(row) {
      return firstExisting(row, CREATED_KEYS);
    }

    function detectState(row) {
      const rawStatus = String(row.status ?? row.state ?? "").toLowerCase();

      const isActive =
        row.is_active === true ||
        row.active === true ||
        row.open === true ||
        rawStatus === "active" ||
        rawStatus === "opened" ||
        rawStatus === "open";

      const isClosed =
        row.is_closed === true ||
        row.closed === true ||
        row.finished === true ||
        rawStatus === "closed" ||
        rawStatus === "finished" ||
        rawStatus === "done" ||
        rawStatus === "ended";

      if (isActive) return { key: "active", label: "ATIVA" };
      if (isClosed) return { key: "closed", label: "FECHADA" };
      return { key: "draft", label: "INATIVA" };
    }

    async function listHunts() {
      return fetchJson(`/rest/v1/hunts?select=*&order=id.desc`, {
        method: "GET",
        headers: getHeaders()
      });
    }

    async function patchHunt(id, patch) {
      return fetchJson(`/rest/v1/hunts?id=eq.${id}`, {
        method: "PATCH",
        headers: getHeaders(),
        body: JSON.stringify(patch)
      });
    }

    async function createMinimalHunt() {
      const attempts = [
        { status: "inactive", is_active: false, is_closed: false },
        { status: "inactive", active: false, closed: false },
        { status: "inactive" },
        { is_active: false },
        { active: false },
        {}
      ];

      let lastError = null;

      for (const payload of attempts) {
        try {
          const created = await fetchJson(`/rest/v1/hunts`, {
            method: "POST",
            headers: getHeaders(),
            body: JSON.stringify(payload)
          });

          if (Array.isArray(created) && created[0]) return created[0];
          if (created && !Array.isArray(created)) return created;
        } catch (err) {
          lastError = err;
        }
      }

      throw lastError || new Error("Não foi possível criar a hunt.");
    }

    async function enrichCreatedHunt(createdRow, name, start) {
      const id = createdRow.id;
      if (!id) return;

      const patchAttempts = [
        { name, start_value: start },
        { name, start_balance: start },
        { name, start: start },
        { name, starting_balance: start },
        { name, initial_balance: start },
        { name, start_amount: start },
        { name, hunt_start: start },
        { hunt_name: name, start_value: start },
        { hunt_name: name, start_balance: start },
        { hunt_name: name, start: start },
        { title: name, start_value: start },
        { title: name, start_balance: start },
        { title: name, start: start },
        { hunt_title: name, start_value: start },
        { hunt_title: name, start_balance: start },
        { label: name, start_value: start },
        { label: name, start_balance: start },
        { nome: name, valor_inicial: start },
        { nome: name, start: start },
        { display_name: name, opening_balance: start },
        { bonus_hunt_name: name, bankroll_start: start },
        { name },
        { hunt_name: name },
        { title: name },
        { hunt_title: name },
        { label: name },
        { nome: name },
        { start_value: start },
        { start_balance: start },
        { start: start },
        { starting_balance: start },
        { initial_balance: start },
        { opening_balance: start },
        { bankroll_start: start },
        { valor_inicial: start }
      ];

      for (const patch of patchAttempts) {
        try {
          await patchHunt(id, patch);
        } catch (_) {}
      }
    }

    async function createHunt() {
      const name = huntNameInput.value.trim();
      const start = Number(huntStartInput.value || 0);

      if (!name) throw new Error("Escreve um nome para a hunt.");

      const created = await createMinimalHunt();
      await enrichCreatedHunt(created, name, start);
      return created;
    }

    async function activateHunt(id) {
      const all = await listHunts();

      for (const row of all) {
        const state = detectState(row);

        if (state.key === "active" && Number(row.id) !== Number(id)) {
          const offAttempts = [
            { is_active: false, status: "inactive" },
            { active: false, status: "inactive" },
            { is_active: false },
            { active: false },
            { status: "inactive" },
            { open: false }
          ];

          for (const patch of offAttempts) {
            try {
              await patchHunt(row.id, patch);
              break;
            } catch (_) {}
          }
        }
      }

      const onAttempts = [
        { is_active: true, status: "active", is_closed: false, closed: false },
        { active: true, status: "active", is_closed: false, closed: false },
        { is_active: true, status: "active" },
        { active: true, status: "active" },
        { is_active: true },
        { active: true },
        { status: "active" },
        { open: true }
      ];

      let lastError = null;

      for (const patch of onAttempts) {
        try {
          return await patchHunt(id, patch);
        } catch (err) {
          lastError = err;
        }
      }

      throw lastError || new Error("Não foi possível ativar a hunt.");
    }

    async function closeHunt(id) {
      const attempts = [
        { status: "closed", is_active: false, is_closed: true, closed: true },
        { status: "closed", active: false, is_closed: true, closed: true },
        { status: "closed", is_active: false },
        { status: "closed", active: false },
        { is_closed: true, is_active: false },
        { closed: true, active: false },
        { status: "closed" },
        { open: false }
      ];

      let lastError = null;

      for (const patch of attempts) {
        try {
          return await patchHunt(id, patch);
        } catch (err) {
          lastError = err;
        }
      }

      throw lastError || new Error("Não foi possível fechar a hunt.");
    }

    function renderHunts(rows) {
      huntCount.textContent = `${rows.length} hunt${rows.length === 1 ? "" : "s"}`;

      if (!rows.length) {
        huntsTableBody.innerHTML = `
          <tr>
            <td colspan="6" class="muted" style="padding:18px 16px;">Não existem hunts para mostrar.</td>
          </tr>
        `;
        return;
      }

      huntsTableBody.innerHTML = rows.map(row => {
        const state = detectState(row);
        const pillClass =
          state.key === "active" ? "pill-active" :
          state.key === "closed" ? "pill-closed" :
          "pill-draft";

        return `
          <tr>
            <td>${escapeHtml(row.id ?? "-")}</td>
            <td><span class="hunt-name">${escapeHtml(getHuntName(row))}</span></td>
            <td>${escapeHtml(formatMoney(getStartValue(row)))}</td>
            <td><span class="pill ${pillClass}">${escapeHtml(state.label)}</span></td>
            <td>${escapeHtml(formatDate(getCreatedAt(row)))}</td>
            <td>
              <div class="row-actions">
                <button class="btn-green" onclick="handleActivate(${Number(row.id)})">Ativar</button>
                <button class="btn-red" onclick="handleClose(${Number(row.id)})">Fechar</button>
              </div>
            </td>
          </tr>
        `;
      }).join("");
    }

    function showDebug(rows) {
      if (!rows.length) {
        setDebug("Debug: sem hunts para analisar.");
        return;
      }

      const row = rows[0];
      const keys = Object.keys(row).sort();

      setDebug(
        "Primeira hunt recebida do Supabase:\n\n" +
        JSON.stringify(row, null, 2) +
        "\n\nChaves detetadas:\n" +
        keys.join(", ")
      );
    }

    async function loadHunts() {
      huntsTableBody.innerHTML = `
        <tr>
          <td colspan="6" class="muted" style="padding:18px 16px;">A carregar hunts...</td>
        </tr>
      `;

      try {
        const hunts = await listHunts();
        const rows = Array.isArray(hunts) ? hunts : [];
        renderHunts(rows);
        showDebug(rows);
        setStatus("Lista de hunts carregada com sucesso.", "ok");
      } catch (err) {
        console.error(err);
        huntsTableBody.innerHTML = `
          <tr>
            <td colspan="6" style="padding:18px 16px; color:#ff9aa7;">
              Erro ao carregar hunts: ${escapeHtml(err.message || String(err))}
            </td>
          </tr>
        `;
        setStatus(`Erro ao carregar hunts: ${err.message || err}`, "err");
        setDebug(`Erro debug:\n${err.message || err}`);
      }
    }

    async function onCreateHunt() {
      createHuntBtn.disabled = true;

      try {
        setStatus("A criar hunt...");
        await createHunt();
        huntNameInput.value = "";
        huntStartInput.value = "";
        setStatus("Hunt criada com sucesso.", "ok");
        await loadHunts();
      } catch (err) {
        console.error(err);
        setStatus(`Erro ao criar hunt: ${err.message || err}`, "err");
      } finally {
        createHuntBtn.disabled = false;
      }
    }

    window.handleActivate = async function(id) {
      try {
        setStatus(`A ativar hunt #${id}...`);
        await activateHunt(id);
        setStatus(`Hunt #${id} ativada com sucesso.`, "ok");
        await loadHunts();
      } catch (err) {
        console.error(err);
        setStatus(`Erro ao ativar hunt #${id}: ${err.message || err}`, "err");
      }
    };

    window.handleClose = async function(id) {
      try {
        setStatus(`A fechar hunt #${id}...`);
        await closeHunt(id);
        setStatus(`Hunt #${id} fechada com sucesso.`, "ok");
        await loadHunts();
      } catch (err) {
        console.error(err);
        setStatus(`Erro ao fechar hunt #${id}: ${err.message || err}`, "err");
      }
    };

    createHuntBtn.addEventListener("click", onCreateHunt);
    refreshBtn.addEventListener("click", loadHunts);

    huntNameInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") onCreateHunt();
    });

    huntStartInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") onCreateHunt();
    });

    loadHunts();
  </script>
</body>
</html>
